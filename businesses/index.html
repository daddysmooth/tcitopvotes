<!doctype html><html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Discover Businesses | TCI Top 10</title><link rel="stylesheet" href="/styles.css"><script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script><script src="/app.js" defer></script><style>body{background:#f5f8fc}.wrap{max-width:1100px;margin:auto;padding:22px 16px 100px}.hero{background:linear-gradient(135deg,#082b55,#1477e6);color:#fff;border-radius:22px;padding:22px 24px}.hero h1{font-size:36px;margin:9px 0 6px}.hero p{margin:0;max-width:720px;line-height:1.4}.filters{display:grid;grid-template-columns:1.4fr 1fr 1fr;gap:10px;margin:16px 0}.filters input,.filters select{min-height:48px;border:1px solid #dce5ef;border-radius:13px;padding:11px;background:#fff}.grid{display:grid;grid-template-columns:repeat(2,1fr);gap:13px}.card{background:#fff;border:1px solid #e1e9f2;border-radius:19px;padding:18px;text-decoration:none;color:#0b2748}.card h2{margin:5px 0}.meta{color:#687b90;font-size:13px}.rating{font-weight:900;color:#d99a00}.verified{color:#148653;font-weight:900;font-size:12px}@media(max-width:700px){.wrap{padding:12px 10px 90px}.hero{padding:16px 17px;border-radius:18px}.hero .pill{font-size:10px;padding:5px 9px}.hero h1{font-size:27px;margin:8px 0 5px}.hero p{font-size:13px;line-height:1.35}.filters,.grid{grid-template-columns:1fr}.filters{margin:12px 0}.card{border-radius:17px}}</style></head><body><header class="header"><a class="brand" href="/"><div class="crown">♛</div><div><strong>TCI TOP 10</strong><span>Discover</span></div></a><nav class="nav"><a href="/">Home</a><a href="/polls">Polls</a><a href="/rankings">Top 10</a><a href="/businesses">Businesses</a></nav><div class="actions" data-member-actions></div></header><main class="wrap"><section class="hero"><span class="pill">DISCOVER TCI</span><h1>Businesses</h1><p>Explore restaurants, transportation, resorts, experiences and services across the Turks and Caicos Islands.</p></section><div class="filters"><input id="search" placeholder="Search businesses..."><select id="category"><option value="">All categories</option><option value="restaurants">Restaurants</option><option value="transportation">Transportation</option><option value="resorts">Resorts</option><option value="things-to-do">Things to Do</option><option value="nightlife">Nightlife</option><option value="shopping">Shopping</option><option value="services">Services</option></select><select id="location"><option value="">All islands</option><option value="providenciales">Providenciales</option><option value="grand-turk">Grand Turk</option><option value="north-caicos">North Caicos</option><option value="middle-caicos">Middle Caicos</option><option value="south-caicos">South Caicos</option><option value="salt-cay">Salt Cay</option></select></div><p id="status" class="small">Loading businesses...</p><section id="grid" class="grid"></section></main><script>const esc=v=>String(v??'').replace(/[&<>'"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;',"'":'&#39;','"':'&quot;'}[c]));let timer;async function load(){if(!window.tciDb){setTimeout(load,120);return}const q=document.getElementById('search').value.trim()||null,c=document.getElementById('category').value||null,l=document.getElementById('location').value||null;const{data,error}=await window.tciDb.rpc('get_public_business_directory',{target_category_slug:c,target_location_slug:l,target_search:q});if(error){document.getElementById('status').textContent=error.message;return}document.getElementById('status').textContent=`${data.length} business${data.length===1?'':'es'} found.`;document.getElementById('grid').innerHTML=data.map(x=>`<a class="card" href="/listings/${encodeURIComponent(x.slug)}"><div class="meta">${esc(x.category_name)}${x.location_name?' · '+esc(x.location_name):''}</div><h2>${esc(x.name)}</h2>${x.is_verified?'<div class="verified">✓ VERIFIED BUSINESS</div>':''}<p>${esc((x.description||'View business profile.').slice(0,145))}</p><div class="meta">${x.review_count?`<span class="rating">★ ${x.average_rating}</span> · ${x.review_count} review${x.review_count===1?'':'s'}`:'New listing'}</div></a>`).join('')||'<article class="card"><h2>No businesses found</h2><p>Try another category, island or search.</p></article>'}['category','location'].forEach(id=>document.getElementById(id).onchange=load);document.getElementById('search').oninput=()=>{clearTimeout(timer);timer=setTimeout(load,250)};window.addEventListener('DOMContentLoaded',load);</script></body></html>
