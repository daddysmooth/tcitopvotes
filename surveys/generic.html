<!doctype html><html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Survey | TCI Top 10</title><link rel="stylesheet" href="/styles.css"><script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script><script src="/app.js" defer></script><style>.surveyPage{max-width:900px;margin:auto;padding:36px 20px 90px}.surveyHeader{background:linear-gradient(135deg,#092a55,#1477e6);color:#fff;border-radius:24px;padding:34px;margin-bottom:22px}.surveyHeader h1{font-size:42px;margin:10px 0}.surveyForm{display:grid;gap:18px}.surveyQuestion{background:#fff;border:1px solid #e6edf5;border-radius:18px;padding:20px}.surveyQuestion h3{margin:0 0 12px}.surveyQuestion label{display:block;margin:8px 0}.surveyQuestion input[type=text],.surveyQuestion textarea,.surveyQuestion select{width:100%;border:1px solid #dce5ef;border-radius:12px;padding:12px 14px}.ratingRow{display:flex;gap:8px;flex-wrap:wrap}.ratingRow label{border:1px solid #dce5ef;border-radius:10px;padding:10px 14px}.surveyNotice{padding:14px;border-radius:14px;background:#eef6ff;margin-bottom:18px}.requiredMark{color:#b42318}@media(max-width:700px){.surveyHeader h1{font-size:32px}}</style></head><body><main class="surveyPage"><a class="brand" href="/surveys"><div class="crown">♛</div><div><strong>TCI TOP 10</strong><span>Community Survey</span></div></a><section id="surveyHeader" class="surveyHeader"><span class="pill">SURVEY</span><h1>Loading survey...</h1><p>Please wait.</p></section><div id="surveyNotice" class="surveyNotice">Loading questions...</div><form id="responseForm" class="surveyForm"></form></main><script>let survey=null,questions=[];const slug=decodeURIComponent(location.pathname.split('/').filter(Boolean).pop());const esc=v=>String(v??'').replace(/[&<>'"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;',"'":'&#39;','"':'&quot;'}[c]));window.addEventListener('DOMContentLoaded',loadSurvey);async function loadSurvey(){const db=window.tciDb;const{data:s,error}=await db.from('surveys').select('*').eq('slug',slug).in('status',['published','closed']).maybeSingle();if(error||!s){document.getElementById('surveyHeader').innerHTML='<h1>Survey unavailable</h1><p>This survey could not be found.</p>';document.getElementById('surveyNotice').textContent='Return to the survey directory.';return}survey=s;const{data:q}=await db.from('survey_questions').select('*,survey_question_options(*)').eq('survey_id',s.id).order('position');questions=q||[];document.title=s.title+' | TCI Top 10';document.getElementById('surveyHeader').innerHTML=`<span class="pill">${s.status==='closed'?'CLOSED SURVEY':'COMMUNITY SURVEY'}</span><h1>${esc(s.title)}</h1><p>${esc(s.description||'Share your feedback with the TCI community.')}</p>`;const expired=s.status==='closed'||(s.closes_at&&new Date(s.closes_at)<=new Date());const session=(await db.auth.getSession()).data.session;if(s.access_mode==='member'&&!session){document.getElementById('surveyNotice').innerHTML=`This survey requires a member account. <a href="/auth?mode=login&next=${encodeURIComponent(location.pathname)}"><strong>Log in to continue</strong></a>.`;return}if(expired){document.getElementById('surveyNotice').textContent='This survey is closed and no longer accepts responses.';return}document.getElementById('surveyNotice').textContent=s.access_mode==='member'?'Your response will be linked to your member account.':'Your response may be submitted without displaying your identity.';renderQuestions()}function renderQuestions(){const form=document.getElementById('responseForm');form.innerHTML=questions.map((q,i)=>`<section class="surveyQuestion" data-question="${q.id}" data-type="${q.question_type}"><h3>${i+1}. ${esc(q.prompt)} ${q.is_required?'<span class="requiredMark">*</span>':''}</h3>${renderInput(q)}</section>`).join('')+'<button class="btn primary" type="submit">Submit Survey</button><p id="responseMessage" class="small"></p>'}function renderInput(q){const opts=(q.survey_question_options||[]).sort((a,b)=>a.position-b.position);if(q.question_type==='single_choice')return opts.map(o=>`<label><input type="radio" name="q-${q.id}" value="${o.id}"> ${esc(o.label)}</label>`).join('');if(q.question_type==='multiple_choice')return opts.map(o=>`<label><input type="checkbox" name="q-${q.id}" value="${o.id}"> ${esc(o.label)}</label>`).join('');if(q.question_type==='dropdown')return `<select name="q-${q.id}"><option value="">Select an option</option>${opts.map(o=>`<option value="${o.id}">${esc(o.label)}</option>`).join('')}</select>`;if(q.question_type==='rating'){let html='<div class="ratingRow">';for(let n=Number(q.min_value||1);n<=Number(q.max_value||5);n++)html+=`<label><input type="radio" name="q-${q.id}" value="${n}"> ${n}</label>`;return html+'</div>'}if(q.question_type==='yes_no')return `<label><input type="radio" name="q-${q.id}" value="true"> Yes</label><label><input type="radio" name="q-${q.id}" value="false"> No</label>`;if(q.question_type==='long_text')return `<textarea name="q-${q.id}" rows="5" placeholder="${esc(q.placeholder||'Enter your response')}"></textarea>`;return `<input type="text" name="q-${q.id}" placeholder="${esc(q.placeholder||'Enter your response')}">`}document.getElementById('responseForm').onsubmit=async e=>{e.preventDefault();if(!survey)return;const answers=[];for(const q of questions){const section=document.querySelector(`[data-question="${q.id}"]`),type=q.question_type;let answer={question_id:q.id};if(['single_choice','dropdown'].includes(type)){const el=section.querySelector('[name="q-'+q.id+'"]:checked')||section.querySelector('select');answer.option_ids=el&&el.value?[Number(el.value)]:[]}else if(type==='multiple_choice')answer.option_ids=[...section.querySelectorAll('input:checked')].map(x=>Number(x.value));else if(type==='rating'){const el=section.querySelector('input:checked');if(el)answer.number=Number(el.value)}else if(type==='yes_no'){const el=section.querySelector('input:checked');if(el)answer.boolean=el.value==='true'}else{answer.text=(section.querySelector('input,textarea')?.value||'').trim()}answers.push(answer)}let token=localStorage.getItem('tci-survey-token');if(!token){token=crypto.randomUUID();localStorage.setItem('tci-survey-token',token)}const{error}=await window.tciDb.rpc('submit_survey_response',{target_slug:slug,response_token:token,response_answers:answers});const msg=document.getElementById('responseMessage');msg.textContent=error?error.message:'Thank you. Your survey response has been submitted.';if(!error){e.target.querySelectorAll('input,textarea,select,button').forEach(x=>x.disabled=true)}};</script></body></html>
