<!doctype html><html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Survey | TCI Top 10</title><link rel="stylesheet" href="/styles.css"><script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script><script src="/app.js" defer></script><style>.surveyPage{max-width:900px;margin:auto;padding:36px 20px 90px}.surveyHeader{background:linear-gradient(135deg,#092a55,#1477e6);color:#fff;border-radius:24px;padding:34px;margin-bottom:22px}.surveyHeader h1{font-size:42px;margin:10px 0}.surveyForm{display:grid;gap:18px}.surveyQuestion,.consentCard{background:#fff;border:1px solid #e6edf5;border-radius:18px;padding:20px}.surveyQuestion h3{margin:0 0 12px}.surveyQuestion label{display:block;margin:8px 0}.surveyQuestion input[type=text],.surveyQuestion textarea,.surveyQuestion select{width:100%;border:1px solid #dce5ef;border-radius:12px;padding:12px 14px}.ratingRow{display:flex;gap:8px;flex-wrap:wrap}.ratingRow label{border:1px solid #dce5ef;border-radius:10px;padding:10px 14px}.surveyNotice{padding:14px;border-radius:14px;background:#eef6ff;margin-bottom:18px}.requiredMark{color:#b42318}.completionCard{background:#fff;border:1px solid #b9dfca;border-radius:20px;padding:28px;text-align:center}.completionIcon{width:64px;height:64px;border-radius:50%;display:grid;place-items:center;margin:0 auto 14px;background:#e8f7ef;color:#15834d;font-size:34px;font-weight:900}.completionActions{display:flex;justify-content:center;gap:10px;flex-wrap:wrap;margin-top:18px}.consentCard label{display:flex;gap:10px;align-items:flex-start;font-weight:700}.consentCard input{margin-top:4px}@media(max-width:700px){.surveyHeader h1{font-size:32px}}</style></head><body><main class="surveyPage"><a class="brand" href="/surveys"><div class="crown">♛</div><div><strong>TCI TOP 10</strong><span>Community Survey</span></div></a><section id="surveyHeader" class="surveyHeader"><span class="pill">SURVEY</span><h1>Loading survey...</h1><p>Please wait.</p></section><div id="surveyNotice" class="surveyNotice">Loading questions...</div><form id="responseForm" class="surveyForm"></form></main><script>let survey=null,questions=[],session=null;const slug=decodeURIComponent(location.pathname.split('/').filter(Boolean).pop());const esc=v=>String(v??'').replace(/[&<>'"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;',"'":'&#39;','"':'&quot;'}[c]));const completionKey=()=>`tci-survey-completed:${slug}`;window.addEventListener('DOMContentLoaded',loadSurvey);async function loadSurvey(){const db=window.tciDb;const{data:s,error}=await db.from('surveys').select('*').eq('slug',slug).in('status',['published','closed']).maybeSingle();if(error||!s){document.getElementById('surveyHeader').innerHTML='<h1>Survey unavailable</h1><p>This survey could not be found.</p>';document.getElementById('surveyNotice').textContent='Return to the survey directory.';return}survey=s;const{data:q}=await db.from('survey_questions').select('*,survey_question_options(*)').eq('survey_id',s.id).order('position');questions=q||[];document.title=s.title+' | TCI Top 10';document.getElementById('surveyHeader').innerHTML=`<span class="pill">${s.status==='closed'?'CLOSED SURVEY':'COMMUNITY SURVEY'}</span><h1>${esc(s.title)}</h1><p>${esc(s.description||'Share your feedback with the TCI community.')}</p>`;session=(await db.auth.getSession()).data.session;if(s.access_mode==='member'&&!session){document.getElementById('surveyNotice').innerHTML=`This survey requires a member account. <a href="/auth?mode=login&next=${encodeURIComponent(location.pathname)}"><strong>Log in to continue</strong></a>.`;return}let completed=false,completedAt=null;if(session){const own=await db.from('survey_responses').select('submitted_at').eq('survey_id',s.id).eq('user_id',session.user.id).maybeSingle();if(own.data){completed=true;completedAt=own.data.submitted_at}}else{const local=localStorage.getItem(completionKey());if(local){completed=true;completedAt=local}}if(completed){showCompletion(completedAt,true);return}const expired=s.status==='closed'||(s.closes_at&&new Date(s.closes_at)<=new Date());if(expired){document.getElementById('surveyNotice').textContent='This survey is closed and no longer accepts responses.';return}document.getElementById('surveyNotice').textContent=s.access_mode==='member'?'Your response will be linked to your member account. One response is allowed per member.':'Your response may be submitted without displaying your identity. One response is allowed on this device.';renderQuestions()}function showCompletion(submittedAt,existing=false){document.getElementById('surveyNotice').style.display='none';const form=document.getElementById('responseForm');const date=submittedAt?new Date(submittedAt).toLocaleString():'';form.innerHTML=`<section class="completionCard"><div class="completionIcon">✓</div><h2>${existing?'Survey already completed':'Response submitted'}</h2><p>${existing?'You have already submitted a response to this survey.':'Thank you. Your feedback has been recorded successfully.'}</p>${date?`<p class="small">Submitted ${esc(date)}</p>`:''}<div class="completionActions"><a class="btn primary" href="/surveys">Browse Surveys</a>${session?'<a class="btn light" href="/profile/surveys">My Survey History</a>':''}</div></section>`}function renderQuestions(){const form=document.getElementById('responseForm');const consent=survey.require_consent?`<section class="consentCard"><h3>Consent</h3><p>${esc(survey.consent_text||'I agree to participate in this survey.')}</p><label><input id="consentCheck" type="checkbox" required> <span>I acknowledge and agree to the statement above.</span></label></section>`:'';form.innerHTML=questions.map((q,i)=>`<section class="surveyQuestion" data-question="${q.id}" data-type="${q.question_type}"><h3>${i+1}. ${esc(q.prompt)} ${q.is_required?'<span class="requiredMark">*</span>':''}</h3>${renderInput(q)}</section>`).join('')+consent+'<button class="btn primary" type="submit">Submit Survey</button><p id="responseMessage" class="small"></p>'}function renderInput(q){const opts=(q.survey_question_options||[]).sort((a,b)=>a.position-b.position);if(q.question_type==='single_choice')return opts.map(o=>`<label><input type="radio" name="q-${q.id}" value="${o.id}"> ${esc(o.label)}</label>`).join('');if(q.question_type==='multiple_choice')return opts.map(o=>`<label><input type="checkbox" name="q-${q.id}" value="${o.id}"> ${esc(o.label)}</label>`).join('');if(q.question_type==='dropdown')return `<select name="q-${q.id}"><option value="">Select an option</option>${opts.map(o=>`<option value="${o.id}">${esc(o.label)}</option>`).join('')}</select>`;if(q.question_type==='rating'){let html='<div class="ratingRow">';for(let n=Number(q.min_value||1);n<=Number(q.max_value||5);n++)html+=`<label><input type="radio" name="q-${q.id}" value="${n}"> ${n}</label>`;return html+'</div>'}if(q.question_type==='yes_no')return `<label><input type="radio" name="q-${q.id}" value="true"> Yes</label><label><input type="radio" name="q-${q.id}" value="false"> No</label>`;if(q.question_type==='long_text')return `<textarea name="q-${q.id}" rows="5" placeholder="${esc(q.placeholder||'Enter your response')}"></textarea>`;return `<input type="text" name="q-${q.id}" placeholder="${esc(q.placeholder||'Enter your response')}">`}document.getElementById('responseForm').onsubmit=async e=>{e.preventDefault();if(!survey)return;const msg=document.getElementById('responseMessage');const consentGiven=!!document.getElementById('consentCheck')?.checked;if(survey.require_consent&&!consentGiven){msg.textContent='You must acknowledge the consent statement before submitting.';return}const submit=e.target.querySelector('button[type="submit"]');submit.disabled=true;submit.textContent='Submitting...';const answers=[];for(const q of questions){const section=document.querySelector(`[data-question="${q.id}"]`),type=q.question_type;let answer={question_id:q.id};if(['single_choice','dropdown'].includes(type)){const el=section.querySelector('[name="q-'+q.id+'"]:checked')||section.querySelector('select');answer.option_ids=el&&el.value?[Number(el.value)]:[]}else if(type==='multiple_choice')answer.option_ids=[...section.querySelectorAll('input:checked')].map(x=>Number(x.value));else if(type==='rating'){const el=section.querySelector('input:checked');if(el)answer.number=Number(el.value)}else if(type==='yes_no'){const el=section.querySelector('input:checked');if(el)answer.boolean=el.value==='true'}else{answer.text=(section.querySelector('input,textarea')?.value||'').trim()}answers.push(answer)}let token=localStorage.getItem('tci-survey-token');if(!token){token=crypto.randomUUID();localStorage.setItem('tci-survey-token',token)}const{error}=await window.tciDb.rpc('submit_survey_response',{target_slug:slug,response_token:token,response_answers:answers,consent_acknowledged:consentGiven});if(error){submit.disabled=false;submit.textContent='Submit Survey';msg.textContent=error.message;if(error.message.includes('already been submitted'))showCompletion(null,true);return}const submittedAt=new Date().toISOString();if(!session)localStorage.setItem(completionKey(),submittedAt);showCompletion(submittedAt,false)};</script></body></html>
