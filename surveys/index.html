;grid-template-columns:repeat(3,1fr);gap:18px}.surveyCard{background:#fff;border:1px solid #e6edf5;border-radius:20px;padding:20px;display:grid;gap:12px}.surveyCard h3{margin:0}.surveyMeta{display:flex;justify-content:space-between;gap:12px;align-items:center}.surveyStatus{font-size:12px;font-weight:900;color:#15834d}.surveyClosed{color:#7a4b00}@media(max-width:900px){.surveyCards{grid-template-columns:1fr}.surveyHero{margin:12px;padding:28px 20px}.surveyHero h1{font-size:34px}.surveyContent{padding:22px 12px 90px}}</style></head><body><main class="shell"><header class="header"><a class="brand" href="/"><div class="crown">♛</div><div><strong>TCI TOP 10</strong><span>Community Surveys</span></div></a><nav class="nav"><a href="/">Explore</a><a href="/polls">Polls</a><a href="/surveys">Surveys</a><a href="/admin/surveys">Create Survey</a></nav><div class="actions" data-member-actions></div></header><section class="surveyHero"><span class="pill">SHARE YOUR VOICE</span><h1>Community Surveys</h1><p>Help improve experiences, services, and opportunities across the Turks and Caicos Islands.</p></section><section class="surveyContent"><div class="sectionTitle"><div><h2>Available Surveys</h2><p id="surveyStatusText" class="small">Loading surveys...</p></div></div><div id="surveyCards" class="surveyCards"></div></section></main><script>const esc=v=>String(v??'').replace(/[&<>'"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;',"'":'&#39;','"':'&quot;'}[c]));window.addEventListener('DOMContentLoaded',loadSurveys);async function loadSurveys(){const{data,error}=await window.tciDb.from('surveys').select('id,title,slug,description,status,access_mode,closes_at,created_at').in('status',['published','closed']).order('created_at',{ascending:false});const status=document.getElementById('surveyStatusText'),cards=document.getElementById('surveyCards');if(error){status.textContent='Unable to load surveys.';return}status.textContent=`${data.length} survey${data.length===1?'':'s'} available`;cards.innerHTML=data.map(s=>{const closed=s.status==='closed'||(s.closes_at&&new Date(s.closes_at)<=new Date());return `<a class="surveyCard" href="/surveys/${encodeURIComponent(s.slug)}"><div class="surveyMeta"><span class="${closed?'surveyStatus surveyClosed':'surveyStatus'}">${closed?'CLOSED':'OPEN'}</span><span class="small">${s.access_mode==='member'?'Members only':'Open access'}</span></div><h3>${esc(s.title)}</h3><p>${esc(s.description||'Complete this survey and share your feedback.')}</p><strong>${closed?'View Survey':'Start Survey →'}</strong></a>`}).join('')||'<div class="panel"><strong>No surveys are available yet.</strong></div>'}</script></body></html>
