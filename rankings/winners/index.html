<!doctype html><html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Past Winners | TCI Top 10</title><link rel="stylesheet" href="/styles.css"><script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script><script src="/app.js" defer></script><style>.wrap{max-width:1050px;margin:auto;padding:36px 22px 90px}.hero{background:linear-gradient(135deg,#092a55,#1477e6);color:#fff;border-radius:24px;padding:34px}.controls{display:flex;gap:10px;flex-wrap:wrap;margin:22px 0}.controls select{padding:12px 14px;border:1px solid #dce5ef;border-radius:12px;min-width:240px}.winnerGrid{display:grid;grid-template-columns:repeat(2,1fr);gap:16px}.winnerCard{background:#fff;border:1px solid #e6edf5;border-radius:20px;padding:22px}.winnerTop{display:flex;justify-content:space-between;gap:14px;align-items:flex-start}.crownMark{font-size:34px}.winnerName{font-size:26px;margin:8px 0}.meta{color:#62748a;font-size:14px}.scoreLine{display:flex;gap:14px;flex-wrap:wrap;margin-top:14px;padding-top:14px;border-top:1px solid #edf2f7}.scoreLine strong{color:#1477e6}.tieNotice{margin-top:12px;padding:10px 12px;border-radius:12px;background:#fff4db;color:#8a5800;font-size:13px;font-weight:800}.empty{background:#fff;border:1px solid #e6edf5;border-radius:18px;padding:24px;color:#62748a}@media(max-width:760px){.winnerGrid{grid-template-columns:1fr}.controls select{width:100%;min-width:0}}</style></head><body><header class="header"><a class="brand" href="/"><div class="crown">♛</div><div><strong>TCI TOP 10</strong><span>Past Winners</span></div></a><nav class="nav"><a href="/">Explore</a><a href="/polls">Polls</a><a href="/rankings">Rankings</a><a href="/rankings/winners">Winners</a><a href="/surveys">Surveys</a></nav><div class="actions" data-member-actions></div></header><main class="wrap"><section class="hero"><span class="pill">WINNERS ARCHIVE</span><h1>TCI Top 10 Champions</h1><p>Celebrate the first-place entries from each officially published ranking period.</p></section><div class="controls"><select id="pollSelect"><option value="">All winner categories</option></select><a class="btn light" href="/rankings">View Full Rankings</a></div><p id="status" class="small">Loading winners...</p><section id="winnerList" class="winnerGrid"></section></main><script>const db=()=>window.tciDb;const esc=v=>String(v??'').replace(/[&<>'"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;',"'":'&#39;','"':'&quot;'}[c]));let winners=[];window.addEventListener('DOMContentLoaded',init);async function init(){const{data,error}=await db().from('ranking_winners').select('id,poll_id,winner_name,vote_count,score,period_key,period_title,published_at,was_tied,polls(title,category_id,categories(name)),poll_options(label,image_url,slug),listings(name,slug)').order('published_at',{ascending:false});if(error){document.getElementById('status').textContent=error.message;return}winners=data||[];const polls=[...new Map(winners.map(x=>[x.poll_id,{id:x.poll_id,title:x.polls?.title||'Ranking',category:x.polls?.categories?.name||''}])).values()];document.getElementById('pollSelect').innerHTML='<option value="">All winner categories</option>'+polls.map(x=>`<option value="${x.id}">${esc(x.category?x.category+' — ':'')}${esc(x.title)}</option>`).join('');document.getElementById('pollSelect').onchange=render;render()}function render(){const pollId=Number(document.getElementById('pollSelect').value);const rows=pollId?winners.filter(x=>x.poll_id===pollId):winners;document.getElementById('status').textContent=rows.length?`${rows.length} official winner${rows.length===1?'':'s'} recorded.`:'No published winners have been recorded yet.';document.getElementById('winnerList').innerHTML=rows.map(x=>{const category=x.polls?.categories?.name||'';const poll=x.polls?.title||'TCI Top 10';const date=x.published_at?new Date(x.published_at).toLocaleDateString():'';return `<article class="winnerCard"><div class="winnerTop"><div><span class="pill">#1 WINNER</span><h2 class="winnerName">${esc(x.winner_name)}</h2><div class="meta">${esc(category?category+' · ':'')}${esc(poll)}</div></div><div class="crownMark">♛</div></div><p><strong>${esc(x.period_title)}</strong></p><div class="meta">${esc(x.period_key)}${date?` · Published ${esc(date)}`:''}</div><div class="scoreLine"><span><strong>${x.vote_count}</strong> vote${x.vote_count===1?'':'s'}</span><span><strong>${Number(x.score).toFixed(1)}</strong> score</span></div>${x.was_tied?'<div class="tieNotice">This winning score was tied. The published alphabetical tie-break determined the displayed #1 entry.</div>':''}</article>`}).join('')||'<div class="empty">The winners archive will appear after the first ranking period is reviewed and published.</div>'}</script></body></html>
