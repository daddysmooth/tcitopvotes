<!doctype html><html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Member Access | TCI Top 10</title><link rel="stylesheet" href="/styles.css"><script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script></head><body><main class="authPage"><a class="brand authBrand" href="/"><div class="crown">♛</div><div><strong>TCI TOP 10</strong><span>Vote. Review. Discover.</span></div></a><section class="authCard"><div class="authIntro"><span class="pill">MEMBER ACCESS</span><h1>Join the TCI community</h1><p>Create an account to vote, save favourites, and take part in community rankings.</p></div><div class="authTabs"><button id="loginTab" class="authTab active">Log In</button><button id="signupTab" class="authTab">Sign Up</button></div><form id="authForm"><div id="nameWrap" hidden><label>Display name</label><input id="displayName" autocomplete="name" placeholder="Your name"></div><label>Email address</label><input id="email" type="email" autocomplete="email" required placeholder="you@example.com"><label>Password</label><input id="password" type="password" autocomplete="current-password" required minlength="6" placeholder="At least 6 characters"><button class="btn primary authSubmit" id="submitBtn" type="submit">Log In</button><p id="message" class="small authMessage"></p></form><a class="small authBack" href="/">← Back to TCI Top 10</a></section></main><script>const db=window.supabase.createClient('https://pkyjfhecxakkikjhazwq.supabase.co','sb_publishable_jK5_tytAq8o8lu4hnk7kAg_vMJleuNt');let mode='login';const next=new URLSearchParams(location.search).get('next')||'/';const form=document.getElementById('authForm'),message=document.getElementById('message'),nameWrap=document.getElementById('nameWrap'),submitBtn=document.getElementById('submitBtn'),loginTab=document.getElementById('loginTab'),signupTab=document.getElementById('signupTab');function setMode(value){mode=value;const signup=value==='signup';nameWrap.hidden=!signup;submitBtn.textContent=signup?'Create Account':'Log In';loginTab.classList.toggle('active',!signup);signupTab.classList.toggle('active',signup);document.getElementById('password').autocomplete=signup?'new-password':'current-password';message.textContent='';}loginTab.onclick=()=>setMode('login');signupTab.onclick=()=>setMode('signup');form.onsubmit=async e=>{e.preventDefault();submitBtn.disabled=true;message.textContent=mode==='signup'?'Creating your account...':'Signing you in...';const email=document.getElementById('email').value.trim(),password=document.getElementById('password').value,display_name=document.getElementById('displayName').value.trim();try{if(mode==='signup'){const {data,error}=await db.auth.signUp({email,password,options:{data:{display_name},emailRedirectTo:location.origin+next}});if(error)throw error;if(data.session){location.href=next}else{message.textContent='Account created. Check your email to confirm your account, then return to log in.'}}else{const {error}=await db.auth.signInWithPassword({email,password});if(error)throw error;location.href=next}}catch(err){message.textContent=err.message||'Unable to complete this request.'}finally{submitBtn.disabled=false}};db.auth.getSession().then(({data})=>{if(data.session)location.href=next});</script></body></html>
