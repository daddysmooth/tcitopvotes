<!doctype html><html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Suggest a Poll | TCI Top 10</title><meta name="description" content="Suggest a new community poll for TCI Top 10."><meta name="robots" content="index,follow"><link rel="canonical" href="https://tcitopvotes.vercel.app/polls/suggest"><link rel="stylesheet" href="/styles.css"><link rel="stylesheet" href="/polls/polls.css"><script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script><script src="/app.js" defer></script><style>.wrap{max-width:840px;margin:auto;padding:28px 18px 90px}.hero{background:linear-gradient(135deg,#092a55,#1477e6);color:white;border-radius:24px;padding:30px}.panel{margin-top:18px;background:white;border:1px solid #e6edf5;border-radius:20px;padding:22px}.form{display:grid;gap:12px}.form label{font-size:13px;font-weight:800}.form input,.form select,.form textarea{width:100%;padding:12px 13px;border:1px solid #dce5ef;border-radius:12px;font:inherit}.optionRow{display:grid;grid-template-columns:1fr auto;gap:8px}.notice{padding:12px 14px;border-radius:12px;background:#f4f8fc;color:#31506f}.history{margin-top:18px}.historyItem{padding:14px 0;border-bottom:1px solid #e6edf5}.badge{display:inline-flex;padding:4px 8px;border-radius:999px;font-size:11px;font-weight:900;text-transform:uppercase;background:#edf3f8;color:#31506f}.badge.pending{background:#fff4db;color:#8a5800}.badge.approved{background:#e8f7ef;color:#15834d}.badge.rejected{background:#fdecec;color:#b42318}@media(max-width:650px){.wrap{padding:14px 12px 82px}.hero{padding:22px 18px;border-radius:20px}.panel{padding:18px}.optionRow{grid-template-columns:1fr}.optionRow .btn{width:100%}}</style></head><body><header class="header"><a class="brand" href="/"><div class="crown">♛</div><div><strong>TCI TOP 10</strong><span>Community Suggestions</span></div></a><nav class="nav"><a href="/">Explore</a><a href="/polls">Polls</a><a href="/rankings">Rankings</a><a href="/surveys">Surveys</a></nav><div class="actions" data-member-actions></div></header><main class="wrap"><section class="hero"><span class="pill">COMMUNITY IDEA</span><h1>Suggest a Poll</h1><p>Share a poll idea for administrator review. Nothing is published automatically.</p></section><section class="panel"><div id="authNotice" class="notice">Checking your account...</div><form id="suggestionForm" class="form" hidden><label>Category</label><select id="category" required></select><label>Poll question or title</label><input id="title" maxlength="140" placeholder="Who makes the best conch salad?" required><label>Description</label><textarea id="description" maxlength="1000" rows="4" placeholder="Explain what the community should consider."></textarea><label>Suggested options</label><div id="optionRows"></div><button type="button" id="addOption" class="btn light">Add Another Option</button><button type="submit" class="btn primary">Submit for Review</button><p id="status" class="small"></p></form></section><section class="panel history"><h2>My Suggestions</h2><div id="historyList" class="small">Sign in to view your submissions.</div></section></main><script>const esc=v=>String(v??'').replace(/[&<>'"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;',"'":'&#39;','"':'&quot;'}[c]));let session=null;function addOption(value=''){const host=document.getElementById('optionRows');const row=document.createElement('div');row.className='optionRow';row.innerHTML=`<input class="optionInput" maxlength="100" placeholder="Suggested option" value="${esc(value)}"><button type="button" class="btn light">Remove</button>`;row.querySelector('button').onclick=()=>{if(document.querySelectorAll('.optionInput').length>2)row.remove()};host.append(row)}async function loadHistory(){if(!session)return;const{data,error}=await window.tciDb.from('poll_suggestions').select('id,title,status,review_notes,created_at,created_poll_id').order('created_at',{ascending:false});const host=document.getElementById('historyList');if(error){host.textContent='Unable to load your suggestions.';return}host.innerHTML=(data||[]).length?(data||[]).map(item=>`<article class="historyItem"><span class="badge ${esc(item.status)}">${esc(item.status)}</span><strong style="display:block;margin-top:6px">${esc(item.title)}</strong><span class="small">Submitted ${new Date(item.created_at).toLocaleDateString()}</span>${item.review_notes?`<p class="small">Administrator note: ${esc(item.review_notes)}</p>`:''}${item.created_poll_id?'<p class="small">Approved and converted to a draft poll.</p>':''}</article>`).join(''):'No suggestions submitted yet.'}async function init(){const{data:{session:s}}=await window.tciDb.auth.getSession();session=s;const notice=document.getElementById('authNotice'),form=document.getElementById('suggestionForm');if(!session){notice.innerHTML='You must be signed in to suggest a poll. <a href="/auth?mode=login&next=%2Fpolls%2Fsuggest">Log in</a> or <a href="/auth?mode=signup&next=%2Fpolls%2Fsuggest">create an account</a>.';return}notice.textContent='Your suggestion will be checked for duplicates and content concerns before entering the administrator queue.';form.hidden=false;const{data}=await window.tciDb.from('categories').select('id,name').eq('status','active').order('name');document.getElementById('category').innerHTML=(data||[]).map(c=>`<option value="${c.id}">${esc(c.name)}</option>`).join('');addOption();addOption();loadHistory()}document.getElementById('addOption').onclick=()=>{if(document.querySelectorAll('.optionInput').length<12)addOption()};document.getElementById('suggestionForm').onsubmit=async event=>{event.preventDefault();const status=document.getElementById('status');const options=[...document.querySelectorAll('.optionInput')].map(x=>x.value.trim()).filter(Boolean);status.textContent='Submitting suggestion...';const{data,error}=await window.tciDb.rpc('submit_poll_suggestion',{target_category_id:Number(document.getElementById('category').value),target_title:document.getElementById('title').value.trim(),target_description:document.getElementById('description').value.trim()||null,target_options:options});if(error){status.textContent=error.message;return}status.textContent=`Suggestion #${data} was submitted for administrator review.`;event.target.reset();document.getElementById('optionRows').innerHTML='';addOption();addOption();loadHistory()};window.addEventListener('DOMContentLoaded',init);</script></body></html>
