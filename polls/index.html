<!doctype html><html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Explore Polls | TCI Top 10</title><link rel="stylesheet" href="/styles.css"><link rel="stylesheet" href="/polls/polls.css"><script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script><script src="/app.js" defer></script></head><body><main class="shell"><header class="header"><a class="brand" href="/"><div class="crown">♛</div><div><strong>TCI TOP 10</strong><span>Vote. Review. Discover.</span></div></a><input id="pollSearch" class="search" placeholder="Search community polls..."><nav class="nav"><a href="/">Explore</a><a href="/rankings">Top 10</a><a href="/polls">Polls</a><a href="/admin">Add a Poll</a><a href="/auth?mode=signup">For Businesses</a></nav><div class="actions" data-member-actions></div></header><section class="directoryHero"><span class="pill">COMMUNITY POLLS</span><h1>Help Decide the Best of TCI</h1><p>Explore active community polls, cast your vote, and follow the live rankings.</p></section><section class="directoryContent"><div class="sectionTitle"><div><h2>Current Polls</h2><p id="directoryStatus" class="small">Loading published polls...</p></div><select id="categoryFilter"><option value="all">All categories</option></select></div><div id="pollDirectory" class="pollDirectory"></div></section><nav class="bottomNav"><a href="/">⌂<span>Home</span></a><a href="/polls">▣<span>Polls</span></a><a href="/rankings">★<span>Top 10</span></a><a href="/admin"><span class="addCircle">+</span><span>Add</span></a><a href="/profile">◷<span>Activity</span></a><a href="/profile">◉<span>Profile</span></a></nav></main><script>let allPolls=[],categories=[];const esc=v=>String(v??'').replace(/[&<>'"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;',"'":'&#39;','"':'&quot;'}[c]));window.addEventListener('DOMContentLoaded',loadDirectory);async function loadDirectory(){const db=window.tciDb;const [pollRes,catRes,optRes]=await Promise.all([db.from('polls').select('id,title,slug,description,category_id,status,voting_method,max_selections,opens_at,closes_at,created_at').in('status',['published','closed']).order('created_at',{ascending:false}),db.from('categories').select('id,name,status').eq('status','active').order('name'),db.from('poll_options').select('poll_id,image_url,status').eq('status','published')]);if(pollRes.error){document.getElementById('directoryStatus').textContent='Unable to load polls.';return}categories=catRes.data||[];const images={};(optRes.data||[]).forEach(o=>{if(!images[o.poll_id]&&o.image_url)images[o.poll_id]=o.image_url});allPolls=(pollRes.data||[]).map(p=>({...p,image_url:images[p.id]||'https://images.unsplash.com/photo-1507525428034-b723cf961d3e?auto=format&fit=crop&w=900&q=85'}));document.getElementById('categoryFilter').innerHTML='<option value="all">All categories</option>'+categories.map(c=>`<option value="${c.id}">${esc(c.name)}</option>`).join('');document.getElementById('directoryStatus').textContent=`${allPolls.length} poll${allPolls.length===1?'':'s'} available`;renderDirectory()}function renderDirectory(){const q=document.getElementById('pollSearch').value.trim().toLowerCase(),cat=document.getElementById('categoryFilter').value;const filtered=allPolls.filter(p=>(cat==='all'||String(p.category_id)===cat)&&(!q||p.title.toLowerCase().includes(q)||(p.description||'').toLowerCase().includes(q)));document.getElementById('pollDirectory').innerHTML=filtered.map(p=>{const category=categories.find(c=>c.id===p.category_id)?.name||'Community';const closed=p.status==='closed'||(p.closes_at&&new Date(p.closes_at)<=new Date());return `<a class="pollCard" href="/polls/${encodeURIComponent(p.slug)}"><div class="pollCardImage" style="background-image:url('${esc(p.image_url)}')"><span class="pollBadge">${closed?'RESULTS':'VOTE NOW'}</span></div><div class="pollCardBody"><span class="small">${esc(category)}</span><h3>${esc(p.title)}</h3><p>${esc(p.description||'Cast your vote and help the community decide.')}</p><div class="pollCardMeta"><span>${p.max_selections} selection${p.max_selections===1?'':'s'}</span><strong>${closed?'View Results':'Open Poll →'}</strong></div></div></a>`}).join('')||'<div class="panel"><strong>No matching polls found.</strong><p class="small">Try another search or category.</p></div>'}document.getElementById('pollSearch').addEventListener('input',renderDirectory);document.getElementById('categoryFilter').addEventListener('change',renderDirectory);</script></body></html>
