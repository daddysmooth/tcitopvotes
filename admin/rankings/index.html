<!doctype html><html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Ranking Manager | TCI Top 10</title><link rel="stylesheet" href="/styles.css"><link rel="stylesheet" href="/admin/admin.css"><script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script><script src="/app.js" defer></script><style>.wrap{max-width:1120px;margin:auto;padding:34px 24px 90px}.grid{display:grid;grid-template-columns:.8fr 1.2fr;gap:22px}.card{background:#fff;border:1px solid #e6edf5;border-radius:20px;padding:22px}.card form{display:grid;gap:10px}.card input,.card select,.card textarea{width:100%;padding:12px 14px;border:1px solid #dce5ef;border-radius:12px}.periodItem{padding:16px 0;border-bottom:1px solid #e6edf5}.actions{display:flex;gap:8px;flex-wrap:wrap;margin-top:10px}.reviewBox{margin-top:12px;padding:14px;border-radius:14px;background:#f7f9fc}.warn{color:#a05a00;font-weight:800}.pass{color:#15834d;font-weight:800}.rankMini{display:grid;grid-template-columns:42px 1fr auto;gap:10px;padding:8px 0;border-bottom:1px solid #edf2f7}.statusTag{font-size:12px;font-weight:900;text-transform:uppercase}.tieTag{display:inline-block;margin-left:6px;padding:2px 7px;border-radius:999px;background:#fff4db;color:#8a5800;font-size:10px;font-weight:900}.winnerPreview{margin-top:14px;padding:16px;border-radius:16px;border:1px solid #b9dfca;background:#eefaf3}.winnerPreview.tie{border-color:#f0cf86;background:#fff8e8}.winnerName{font-size:22px;font-weight:900;margin:5px 0}.publishCheck{display:flex;gap:9px;align-items:flex-start;margin-top:12px;padding:12px;border-radius:12px;background:#fff}.publishCheck input{width:auto;margin-top:4px}@media(max-width:820px){.grid{grid-template-columns:1fr}.rankMini{grid-template-columns:34px 1fr}.rankMini>span:last-child{grid-column:2}}</style></head><body><main class="adminPage"><header class="header"><a class="brand" href="/"><div class="crown">♛</div><div><strong>TCI TOP 10</strong><span>Ranking Manager</span></div></a><div class="actions" data-member-actions></div></header><section class="wrap"><span class="pill">RANKING ENGINE</span><h1>Manage Top 10 Rankings</h1><p id="status" class="small">Checking administrator access...</p><div id="content" hidden class="grid"><section class="card"><h2>Create Ranking Period</h2><form id="periodForm"><label>Poll</label><select id="poll"></select><label>Period key</label><input id="periodKey" placeholder="2026-08" required><label>Title</label><input id="title" placeholder="August 2026 Rankings" required><div class="formRow"><div><label>Starts</label><input id="starts" type="datetime-local"></div><div><label>Ends</label><input id="ends" type="datetime-local"></div></div><button class="btn primary" type="submit">Create Draft Period</button></form><p id="message" class="small"></p></section><section class="card"><h2>Ranking Periods</h2><p class="small">Order: score, vote count, then alphabetical name for exact ties.</p><div id="periodList"></div></section></div></section></main><script>const db=()=>window.tciDb;const esc=v=>String(v??'').replace(/[&<>'"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;',"'":'&#39;','"':'&quot;'}[c]));let session=null,polls=[],periods=[],results=[];window.addEventListener('DOMContentLoaded',init);async function init(){session=(await db().auth.getSession()).data.session;if(!session){location.href='/auth?mode=login&next=%2Fadmin%2Frankings';return}const roles=await db().from('user_roles').select('role').eq('user_id',session.user.id);if(!(roles.data||[]).some(r=>['administrator','super_administrator'].includes(r.role))){document.getElementById('status').textContent='Administrator access is required.';return}document.getElementById('content').hidden=false;document.getElementById('status').textContent='Administrator access confirmed.';await loadAll()}async function loadAll(){const [p,r,res]=await Promise.all([db().from('polls').select('id,title,ranking_period').order('created_at',{ascending:false}),db().from('ranking_periods').select('*,polls(title)').order('created_at',{ascending:false}),db().from('ranking_results').select('ranking_period_id,position,previous_position,vote_count,score,movement,is_tied,poll_options(label)').order('position')]);polls=p.data||[];periods=r.data||[];results=res.data||[];document.getElementById('poll').innerHTML=polls.map(x=>`<option value="${x.id}">${esc(x.title)}</option>`).join('');document.getElementById('periodList').innerHTML=periods.map(renderPeriod).join('')||'<p class="small">No ranking periods yet.</p>'}function renderPeriod(x){const rows=results.filter(r=>r.ranking_period_id===x.id);const winner=rows.find(r=>r.position===1);const voteTotal=rows.reduce((n,r)=>n+r.vote_count,0);const tiedCount=rows.filter(r=>r.is_tied).length;const zeroCount=rows.filter(r=>r.vote_count===0).length;const warnings=[];if(!rows.length)warnings.push('No calculated results');if(tiedCount)warnings.push(`${tiedCount} tied entr${tiedCount===1?'y':'ies'}`);if(zeroCount)warnings.push(`${zeroCount} zero-vote entr${zeroCount===1?'y':'ies'}`);const reviewed=!!x.reviewed_at;const publishReady=reviewed&&rows.length&&winner;const winnerDisclosure=winner?`<div class="winnerPreview ${winner.is_tied?'tie':''}"><span class="pill">FINAL WINNER PREVIEW</span><div class="winnerName">#1 ${esc(winner.poll_options?.label||'Entry')}</div><div class="small">${winner.vote_count} vote${winner.vote_count===1?'':'s'} · Score ${Number(winner.score).toFixed(1)}</div>${winner.is_tied?'<p class="warn">This first-place result is tied. The displayed winner is first only because exact ties are ordered alphabetically.</p>':'<p class="pass">This entry is the outright first-place result.</p>'}<label class="publishCheck"><input id="publish-check-${x.id}" type="checkbox" ${publishReady?'':'disabled'}><span>I confirm this is the winner that should be published and recorded in the Past Winners archive.</span></label></div>`:'<div class="winnerPreview"><p class="small">Calculate results to preview the official winner.</p></div>';return `<article class="periodItem"><strong>${esc(x.polls?.title||'Poll')} — ${esc(x.title)}</strong><div class="small">${esc(x.period_key)} · <span class="statusTag">${x.status}</span> · ${rows.length} entries · ${voteTotal} total selections</div><div class="reviewBox"><div class="${warnings.length?'warn':'pass'}">${warnings.length?'Review required: '+warnings.join(' · '):'No ranking warnings detected.'}</div>${rows.map(r=>`<div class="rankMini"><strong>#${r.position}</strong><span>${esc(r.poll_options?.label||'Entry')}${r.is_tied?'<span class="tieTag">TIED</span>':''}</span><span>${r.vote_count} vote${r.vote_count===1?'':'s'} · ${Number(r.score).toFixed(1)}</span></div>`).join('')||'<p class="small">Calculate results to begin review.</p>'}<label>Review notes</label><textarea id="notes-${x.id}" rows="2" placeholder="Record tie handling, data checks, or publication notes">${esc(x.review_notes||'')}</textarea><div class="small">${reviewed?'Reviewed '+new Date(x.reviewed_at).toLocaleString():'Not yet reviewed'}</div>${winnerDisclosure}</div><div class="actions"><button class="btn light" type="button" onclick="refreshPeriod(${x.id})">Calculate Top 10</button><button class="btn light" type="button" onclick="markReviewed(${x.id})">Mark Reviewed</button><button class="btn primary" type="button" onclick="publishPeriod(${x.id})" ${publishReady?'':'disabled'}>Publish</button><button class="btn light" type="button" onclick="exportPeriod(${x.id})" ${rows.length?'':'disabled'}>Export CSV</button><a class="btn light" href="/admin/rankings/history?period=${x.id}">History View</a><button class="btn light" type="button" onclick="setStatus(${x.id},'archived')">Archive</button><a class="btn light" href="/rankings">View Public</a></div></article>`}document.getElementById('periodForm').onsubmit=async e=>{e.preventDefault();const starts=document.getElementById('starts').value,ends=document.getElementById('ends').value;const{error}=await db().from('ranking_periods').insert({poll_id:Number(document.getElementById('poll').value),period_key:document.getElementById('periodKey').value.trim(),title:document.getElementById('title').value.trim(),starts_at:starts?new Date(starts).toISOString():null,ends_at:ends?new Date(ends).toISOString():null,status:'draft',created_by:session.user.id});document.getElementById('message').textContent=error?error.message:'Draft ranking period created.';if(!error){e.target.reset();await loadAll()}};async function refreshPeriod(id){const{data,error}=await db().rpc('refresh_ranking_period',{target_period_id:id});document.getElementById('status').textContent=error?error.message:`Top ${data} ranking entries calculated. Review approval was reset.`;if(!error)await loadAll()}async function markReviewed(id){const notes=document.getElementById(`notes-${id}`).value.trim();if(!confirm('Confirm that you reviewed vote totals, ties, zero-vote entries, alphabetical tie ordering, and the displayed first-place winner?'))return;const{error}=await db().from('ranking_periods').update({reviewed_at:new Date().toISOString(),reviewed_by:session.user.id,review_notes:notes,updated_at:new Date().toISOString()}).eq('id',id);document.getElementById('status').textContent=error?error.message:'Ranking period marked as reviewed.';if(!error)await loadAll()}async function publishPeriod(id){const period=periods.find(x=>x.id===id),winner=results.find(r=>r.ranking_period_id===id&&r.position===1),checked=document.getElementById(`publish-check-${id}`)?.checked;if(!checked){document.getElementById('status').textContent='Confirm the final winner preview before publishing.';return}const tieMessage=winner?.is_tied?' This winner is part of a tied score group and appears first through the alphabetical tie-break.':'';if(!confirm(`Publish ${period?.title||'this ranking period'} with ${winner?.poll_options?.label||'the displayed entry'} as the official #1 winner?${tieMessage}`))return;const{error}=await db().rpc('publish_ranking_period',{target_period_id:id});document.getElementById('status').textContent=error?error.message:'Ranking period published and winner archived.';if(!error)await loadAll()}function exportPeriod(id){const period=periods.find(x=>x.id===id),rows=results.filter(r=>r.ranking_period_id===id);const data=[['Poll','Ranking Period','Period Key','Status','Position','Entry','Vote Count','Score','Previous Position','Movement','Tied','Reviewed At','Review Notes']];rows.forEach(r=>data.push([period?.polls?.title||'',period?.title||'',period?.period_key||'',period?.status||'',r.position,r.poll_options?.label||'',r.vote_count,r.score,r.previous_position||'',r.movement,r.is_tied?'Yes':'No',period?.reviewed_at||'',period?.review_notes||'']));const csv=data.map(row=>row.map(v=>'"'+String(v??'').replace(/"/g,'""')+'"').join(',')).join('\n');const blob=new Blob([csv],{type:'text/csv;charset=utf-8'}),url=URL.createObjectURL(blob),a=document.createElement('a');a.href=url;a.download=((period?.title||'ranking-period').toLowerCase().replace(/[^a-z0-9]+/g,'-'))+'.csv';a.click();URL.revokeObjectURL(url)}async function setStatus(id,status){const{error}=await db().from('ranking_periods').update({status,published_at:null,updated_at:new Date().toISOString()}).eq('id',id);document.getElementById('status').textContent=error?error.message:`Ranking period changed to ${status}.`;if(!error)await loadAll()}</script></body></html>
