<!doctype html><html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Ranking Manager | TCI Top 10</title><link rel="stylesheet" href="/styles.css"><link rel="stylesheet" href="/admin/admin.css"><script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script><script src="/app.js" defer></script><style>.wrap{max-width:1120px;margin:auto;padding:34px 24px 90px}.grid{display:grid;grid-template-columns:.85fr 1.15fr;gap:22px}.card{background:#fff;border:1px solid #e6edf5;border-radius:20px;padding:22px}.card form{display:grid;gap:10px}.card input,.card select{width:100%;padding:12px 14px;border:1px solid #dce5ef;border-radius:12px}.periodItem{padding:14px 0;border-bottom:1px solid #e6edf5}.actions{display:flex;gap:8px;flex-wrap:wrap;margin-top:10px}@media(max-width:820px){.grid{grid-template-columns:1fr}}</style></head><body><main class="adminPage"><header class="header"><a class="brand" href="/"><div class="crown">♛</div><div><strong>TCI TOP 10</strong><span>Ranking Manager</span></div></a><div class="actions" data-member-actions></div></header><section class="wrap"><span class="pill">RANKING ENGINE</span><h1>Manage Top 10 Rankings</h1><p id="status" class="small">Checking administrator access...</p><div id="content" hidden class="grid"><section class="card"><h2>Create Ranking Period</h2><form id="periodForm"><label>Poll</label><select id="poll"></select><label>Period key</label><input id="periodKey" placeholder="2026-08" required><label>Title</label><input id="title" placeholder="August 2026 Rankings" required><div class="formRow"><div><label>Starts</label><input id="starts" type="datetime-local"></div><div><label>Ends</label><input id="ends" type="datetime-local"></div></div><label>Status</label><select id="periodStatus"><option value="draft">Draft</option><option value="published">Published</option></select><button class="btn primary" type="submit">Create Period</button></form><p id="message" class="small"></p></section><section class="card"><h2>Ranking Periods</h2><div id="periodList"></div></section></div></section></main><script>const db=()=>window.tciDb;const esc=v=>String(v??'').replace(/[&<>'"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;',"'":'&#39;','"':'&quot;'}[c]));let session=null,polls=[],periods=[];window.addEventListener('DOMContentLoaded',init);async function init(){session=(await db().auth.getSession()).data.session;if(!session){location.href='/auth?mode=login&next=%2Fadmin%2Frankings';return}const roles=await db().from('user_roles').select('role').eq('user_id',session.user.id);if(!(roles.data||[]).some(r=>['administrator','super_administrator'].includes(r.role))){document.getElementById('status').textContent='Administrator access is required.';return}document.getElementById('content').hidden=false;document.getElementById('status').textContent='Administrator access confirmed.';await loadAll()}async function loadAll(){const [p,r]=await Promise.all([db().from('polls').select('id,title,ranking_period').order('created_at',{ascending:false}),db().from('ranking_periods').select('*,polls(title)').order('created_at',{ascending:false})]);polls=p.data||[];periods=r.data||[];document.getElementById('poll').innerHTML=polls.map(x=>`<option value="${x.id}">${esc(x.title)}</option>`).join('');document.getElementById('periodList').innerHTML=periods.map(x=>`<article class="periodItem"><strong>${esc(x.polls?.title||'Poll')} — ${esc(x.title)}</strong><div class="small">${esc(x.period_key)} · ${x.status}</div><div class="actions"><button class="btn light" type="button" onclick="refreshPeriod(${x.id})">Calculate Top 10</button><button class="btn light" type="button" onclick="setStatus(${x.id},'published')">Publish</button><button class="btn light" type="button" onclick="setStatus(${x.id},'archived')">Archive</button><a class="btn light" href="/rankings">View Public</a></div></article>`).join('')||'<p class="small">No ranking periods yet.</p>'}document.getElementById('periodForm').onsubmit=async e=>{e.preventDefault();const starts=document.getElementById('starts').value,ends=document.getElementById('ends').value,status=document.getElementById('periodStatus').value;const{error}=await db().from('ranking_periods').insert({poll_id:Number(document.getElementById('poll').value),period_key:document.getElementById('periodKey').value.trim(),title:document.getElementById('title').value.trim(),starts_at:starts?new Date(starts).toISOString():null,ends_at:ends?new Date(ends).toISOString():null,status,published_at:status==='published'?new Date().toISOString():null,created_by:session.user.id});document.getElementById('message').textContent=error?error.message:'Ranking period created.';if(!error){e.target.reset();await loadAll()}};async function refreshPeriod(id){const{data,error}=await db().rpc('refresh_ranking_period',{target_period_id:id});document.getElementById('status').textContent=error?error.message:`Top ${data} ranking entries calculated.`;if(!error)await loadAll()}async function setStatus(id,status){const{error}=await db().from('ranking_periods').update({status,published_at:status==='published'?new Date().toISOString():null,updated_at:new Date().toISOString()}).eq('id',id);document.getElementById('status').textContent=error?error.message:`Ranking period changed to ${status}.`;if(!error)await loadAll()}</script></body></html>
