<!doctype html><html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Ranking Manager | TCI Top 10</title><link rel="stylesheet" href="/styles.css"><link rel="stylesheet" href="/admin/admin.css"><script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script><script src="/app.js" defer></script><style>:root{--ink:#0b2748;--muted:#6c7f92;--line:#e1e9f1;--blue:#1477e6;--green:#15834d;--amber:#9b6200}.wrap{max-width:1180px;margin:auto;padding:22px 18px 90px}.pageTop{display:flex;justify-content:space-between;align-items:end;gap:16px;margin-bottom:18px}.pageTop h1{font-size:32px;margin:4px 0;color:var(--ink)}.pageTop p{margin:0;color:var(--muted)}.topLinks{display:flex;gap:8px;flex-wrap:wrap}.grid{display:grid;grid-template-columns:360px 1fr;gap:18px;align-items:start}.card{background:#fff;border:1px solid var(--line);border-radius:18px;padding:19px;box-shadow:0 8px 24px rgba(12,39,70,.04)}.createCard{position:sticky;top:16px}.card h2{margin:0 0 14px;color:var(--ink);font-size:20px}.card form{display:grid;gap:8px}.card label{font-size:12px;font-weight:800;color:#334e68}.card input,.card select,.card textarea{width:100%;padding:11px 12px;border:1px solid #d7e1eb;border-radius:11px;background:#fff;font:inherit}.formRow{display:grid;grid-template-columns:1fr 1fr;gap:8px}.periodItem{padding:18px 0;border-bottom:1px solid var(--line)}.periodItem:first-child{padding-top:2px}.periodTitle{display:flex;justify-content:space-between;gap:12px;align-items:start}.periodTitle strong{font-size:16px;color:var(--ink)}.statusChip{padding:5px 9px;border-radius:999px;background:#eef5ff;color:#1767bc;font-size:10px;font-weight:900;text-transform:uppercase}.summary{display:flex;gap:12px;flex-wrap:wrap;margin:7px 0 12px;color:var(--muted);font-size:12px}.reviewBox{padding:13px;border-radius:14px;background:#f7f9fc;border:1px solid #edf1f5}.warn{color:var(--amber);font-weight:800}.pass{color:var(--green);font-weight:800}.rankMini{display:grid;grid-template-columns:38px 1fr auto;gap:9px;align-items:center;padding:8px 0;border-bottom:1px solid #e9eef4}.rankMini:last-of-type{border-bottom:0}.rankNo{width:29px;height:29px;border-radius:9px;background:#eaf3ff;color:var(--blue);display:grid;place-items:center;font-weight:900}.tieTag{display:inline-block;margin-left:6px;padding:2px 6px;border-radius:999px;background:#fff1cf;color:#8a5800;font-size:9px;font-weight:900}.winnerPreview{margin-top:12px;padding:14px;border-radius:14px;border:1px solid #b9dfca;background:#eefaf3}.winnerPreview.tie{border-color:#edca78;background:#fff8e8}.winnerName{font-size:20px;font-weight:950;color:var(--ink);margin:4px 0}.publishCheck{display:flex;gap:10px;align-items:flex-start;margin-top:11px;padding:12px;border:1px solid #dfe7ef;border-radius:11px;background:#fff;cursor:pointer}.publishCheck input{width:20px;height:20px;min-width:20px;margin:1px 0 0;accent-color:var(--green);cursor:pointer}.publishCheck span{font-size:13px;line-height:1.35}.steps{display:flex;gap:6px;flex-wrap:wrap;margin:0 0 12px}.step{padding:6px 9px;border-radius:999px;background:#edf2f7;color:#6a7d90;font-size:10px;font-weight:850}.step.done{background:#e8f8ef;color:#137646}.periodActions{display:flex;gap:7px;flex-wrap:wrap;margin-top:11px}.periodActions .btn{min-height:39px}.publishBtn:disabled{opacity:.45}.statusBar{padding:10px 12px;background:#f4f7fb;border-radius:11px;color:var(--muted);font-size:12px;margin-bottom:15px}@media(max-width:850px){.grid{grid-template-columns:1fr}.createCard{position:static}.pageTop{display:block}.topLinks{margin-top:12px}}@media(max-width:600px){.wrap{padding:14px 10px 82px}.pageTop h1{font-size:27px}.formRow{grid-template-columns:1fr}.card{padding:14px}.rankMini{grid-template-columns:32px 1fr}.rankMini>span:last-child{grid-column:2}.periodTitle{display:block}.statusChip{display:inline-block;margin-top:6px}.periodActions{display:grid;grid-template-columns:1fr 1fr}.periodActions .btn{width:100%}.header .nav{display:none}}</style></head><body><main class="adminPage"><header class="header"><a class="brand" href="/"><div class="crown">♛</div><div><strong>TCI TOP 10</strong><span>Ranking Manager</span></div></a><div class="actions" data-member-actions></div></header><section class="wrap"><div class="pageTop"><div><span class="pill">RANKING ENGINE</span><h1>Manage Top 10 Rankings</h1><p>Create, review and publish official TCI Top 10 ranking periods.</p></div><div class="topLinks"><a class="btn light" href="/admin/rankings/winners-audit">Winners Audit</a><a class="btn light" href="/admin/surveys/integrity">Survey Integrity</a><a class="btn light" href="/rankings">Public Rankings</a></div></div><p id="status" class="statusBar">Checking administrator access...</p><div id="content" hidden class="grid"><section class="card createCard"><h2>Create Ranking Period</h2><form id="periodForm"><label>Poll</label><select id="poll"></select><label>Period key</label><input id="periodKey" placeholder="2026-08" required><label>Title</label><input id="title" placeholder="August 2026 Rankings" required><div class="formRow"><div><label>Starts</label><input id="starts" type="datetime-local"></div><div><label>Ends</label><input id="ends" type="datetime-local"></div></div><button class="btn primary" type="submit">Create Draft Period</button></form><p id="message" class="small"></p></section><section class="card"><h2>Ranking Periods</h2><div id="periodList"></div></section></div></section></main><script>const db=()=>window.tciDb;const esc=v=>String(v??'').replace(/[&<>'"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;',"'":'&#39;','"':'&quot;'}[c]));let session=null,polls=[],periods=[],results=[],confirmed=new Set();window.addEventListener('DOMContentLoaded',init);async function init(){session=(await db().auth.getSession()).data.session;if(!session){location.href='/auth?mode=login&next=%2Fadmin%2Frankings';return}const roles=await db().from('user_roles').select('role').eq('user_id',session.user.id);if(!(roles.data||[]).some(r=>['administrator','super_administrator'].includes(r.role))){document.getElementById('status').textContent='Administrator access is required.';return}document.getElementById('content').hidden=false;document.getElementById('status').textContent='Administrator access confirmed.';await loadAll()}async function loadAll(){const[p,r,res]=await Promise.all([db().from('polls').select('id,title,ranking_period').order('created_at',{ascending:false}),db().from('ranking_periods').select('*,polls(title)').order('created_at',{ascending:false}),db().from('ranking_results').select('ranking_period_id,position,previous_position,vote_count,score,movement,is_tied,poll_options(label)').order('position')]);polls=p.data||[];periods=r.data||[];results=res.data||[];document.getElementById('poll').innerHTML=polls.map(x=>`<option value="${x.id}">${esc(x.title)}</option>`).join('');document.getElementById('periodList').innerHTML=periods.map(renderPeriod).join('')||'<p class="small">No ranking periods yet.</p>';bindChecks()}function bindChecks(){document.querySelectorAll('[data-winner-check]').forEach(el=>{el.addEventListener('change',()=>{const id=Number(el.dataset.winnerCheck);if(el.checked)confirmed.add(id);else confirmed.delete(id);renderPublishState(id)})})}function renderPublishState(id){const period=periods.find(x=>x.id===id),rows=results.filter(r=>r.ranking_period_id===id),winner=rows.find(r=>r.position===1),button=document.getElementById(`publish-${id}`),hint=document.getElementById(`publish-hint-${id}`);const ready=!!period?.reviewed_at&&!!winner&&confirmed.has(id);if(button)button.disabled=!ready;if(hint)hint.textContent=!winner?'Calculate results first.':!confirmed.has(id)?'Confirm the displayed winner.':!period?.reviewed_at?'Winner confirmed — now mark the period reviewed.':'Ready to publish.'}function renderPeriod(x){const rows=results.filter(r=>r.ranking_period_id===x.id),winner=rows.find(r=>r.position===1),voteTotal=rows.reduce((n,r)=>n+r.vote_count,0),tiedCount=rows.filter(r=>r.is_tied).length,zeroCount=rows.filter(r=>r.vote_count===0).length,warnings=[];if(!rows.length)warnings.push('No calculated results');if(tiedCount)warnings.push(`${tiedCount} tied entr${tiedCount===1?'y':'ies'}`);if(zeroCount)warnings.push(`${zeroCount} zero-vote entr${zeroCount===1?'y':'ies'}`);const reviewed=!!x.reviewed_at,isConfirmed=confirmed.has(x.id);const winnerDisclosure=winner?`<div class="winnerPreview ${winner.is_tied?'tie':''}"><span class="pill">WINNER PREVIEW</span><div class="winnerName">#1 ${esc(winner.poll_options?.label||'Entry')}</div><div class="small">${winner.vote_count} vote${winner.vote_count===1?'':'s'} · Score ${Number(winner.score).toFixed(1)}</div>${winner.is_tied?'<p class="warn">First place is tied. Alphabetical ordering currently places this entry first.</p>':'<p class="pass">Outright first-place result.</p>'}<label class="publishCheck"><input data-winner-check="${x.id}" id="publish-check-${x.id}" type="checkbox" ${isConfirmed?'checked':''}><span><strong>Confirm winner:</strong> I have checked this result and confirm this is the entry intended for publication.</span></label></div>`:'<div class="winnerPreview"><p class="small">Calculate results to preview and confirm the winner.</p></div>';return `<article class="periodItem"><div class="periodTitle"><strong>${esc(x.polls?.title||'Poll')} — ${esc(x.title)}</strong><span class="statusChip">${esc(x.status)}</span></div><div class="summary"><span>${esc(x.period_key)}</span><span>${rows.length} entries</span><span>${voteTotal} selections</span></div><div class="steps"><span class="step ${rows.length?'done':''}">1 Calculate</span><span class="step ${isConfirmed?'done':''}">2 Confirm Winner</span><span class="step ${reviewed?'done':''}">3 Review</span><span class="step ${x.status==='published'?'done':''}">4 Publish</span></div><div class="reviewBox"><div class="${warnings.length?'warn':'pass'}">${warnings.length?'Review: '+warnings.join(' · '):'No ranking warnings detected.'}</div>${rows.map(r=>`<div class="rankMini"><strong class="rankNo">${r.position}</strong><span>${esc(r.poll_options?.label||'Entry')}${r.is_tied?'<span class="tieTag">TIED</span>':''}</span><span>${r.vote_count} vote${r.vote_count===1?'':'s'} · ${Number(r.score).toFixed(1)}</span></div>`).join('')||'<p class="small">No calculated results yet.</p>'}${winnerDisclosure}<label style="display:block;margin-top:12px">Review notes</label><textarea id="notes-${x.id}" rows="2" placeholder="Tie handling, data checks, or publication notes">${esc(x.review_notes||'')}</textarea><div class="small">${reviewed?'✓ Reviewed '+new Date(x.reviewed_at).toLocaleString():'Not yet reviewed'}</div><div id="publish-hint-${x.id}" class="small" style="margin-top:5px">${!winner?'Calculate results first.':!isConfirmed?'Confirm the displayed winner.':!reviewed?'Winner confirmed — now mark the period reviewed.':'Ready to publish.'}</div></div><div class="periodActions"><button class="btn light" type="button" onclick="refreshPeriod(${x.id})">Calculate</button><button class="btn light" type="button" onclick="markReviewed(${x.id})" ${winner?'':'disabled'}>Mark Reviewed</button><button id="publish-${x.id}" class="btn primary publishBtn" type="button" onclick="publishPeriod(${x.id})" ${reviewed&&winner&&isConfirmed?'':'disabled'}>Publish</button><button class="btn light" type="button" onclick="exportPeriod(${x.id})" ${rows.length?'':'disabled'}>Export CSV</button><a class="btn light" href="/admin/rankings/history?period=${x.id}">History</a><button class="btn light" type="button" onclick="archivePeriod(${x.id})">Archive</button></div></article>`}document.getElementById('periodForm').onsubmit=async e=>{e.preventDefault();const starts=document.getElementById('starts').value,ends=document.getElementById('ends').value;const{error}=await db().from('ranking_periods').insert({poll_id:Number(document.getElementById('poll').value),period_key:document.getElementById('periodKey').value.trim(),title:document.getElementById('title').value.trim(),starts_at:starts?new Date(starts).toISOString():null,ends_at:ends?new Date(ends).toISOString():null,status:'draft',created_by:session.user.id});document.getElementById('message').textContent=error?error.message:'Draft ranking period created.';if(!error){e.target.reset();await loadAll()}};async function refreshPeriod(id){confirmed.delete(id);const{data,error}=await db().rpc('refresh_ranking_period',{target_period_id:id});document.getElementById('status').textContent=error?error.message:`Top ${data} entries calculated. Confirm the winner, then complete review.`;if(!error)await loadAll()}async function markReviewed(id){if(!confirmed.has(id)){document.getElementById('status').textContent='Confirm the displayed winner before marking this ranking reviewed.';return}const notes=document.getElementById(`notes-${id}`).value.trim();if(!confirm('Mark this ranking reviewed after checking vote totals, ties, zero-vote entries and the confirmed winner?'))return;const{error}=await db().from('ranking_periods').update({reviewed_at:new Date().toISOString(),reviewed_by:session.user.id,review_notes:notes,updated_at:new Date().toISOString()}).eq('id',id);document.getElementById('status').textContent=error?error.message:'Ranking reviewed. The confirmed winner is ready for publication.';if(!error)await loadAll()}async function publishPeriod(id){const period=periods.find(x=>x.id===id),winner=results.find(r=>r.ranking_period_id===id&&r.position===1);if(!confirmed.has(id)){document.getElementById('status').textContent='Confirm the final winner before publishing.';return}if(!period?.reviewed_at){document.getElementById('status').textContent='Mark the ranking reviewed before publishing.';return}const tieMessage=winner?.is_tied?' This winner is part of a tied group and appears first through alphabetical ordering.':'';if(!confirm(`Publish ${period?.title||'this ranking'} with ${winner?.poll_options?.label||'the displayed entry'} as #1?${tieMessage}`))return;const{error}=await db().rpc('publish_ranking_period',{target_period_id:id});document.getElementById('status').textContent=error?error.message:'Ranking published and winner recorded.';if(!error){confirmed.delete(id);await loadAll()}}async function archivePeriod(id){const period=periods.find(x=>x.id===id);if(!confirm(`Archive ${period?.title||'this ranking period'}?`))return;const{error}=await db().rpc('archive_ranking_period',{target_period_id:id});document.getElementById('status').textContent=error?error.message:'Ranking period archived.';if(!error){confirmed.delete(id);await loadAll()}}function exportPeriod(id){const period=periods.find(x=>x.id===id),rows=results.filter(r=>r.ranking_period_id===id),data=[['Poll','Ranking Period','Period Key','Status','Position','Entry','Vote Count','Score','Previous Position','Movement','Tied','Reviewed At','Review Notes']];rows.forEach(r=>data.push([period?.polls?.title||'',period?.title||'',period?.period_key||'',period?.status||'',r.position,r.poll_options?.label||'',r.vote_count,r.score,r.previous_position||'',r.movement,r.is_tied?'Yes':'No',period?.reviewed_at||'',period?.review_notes||'']));const csv=data.map(row=>row.map(v=>'"'+String(v??'').replace(/"/g,'""')+'"').join(',')).join('\n'),blob=new Blob([csv],{type:'text/csv;charset=utf-8'}),url=URL.createObjectURL(blob),a=document.createElement('a');a.href=url;a.download=((period?.title||'ranking-period').toLowerCase().replace(/[^a-z0-9]+/g,'-'))+'.csv';a.click();URL.revokeObjectURL(url)}</script></body></html>
