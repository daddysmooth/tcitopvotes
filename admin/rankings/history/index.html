<!doctype html><html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Ranking History | TCI Top 10</title><link rel="stylesheet" href="/styles.css"><link rel="stylesheet" href="/admin/admin.css"><script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script><script src="/app.js" defer></script><style>.wrap{max-width:1050px;margin:auto;padding:34px 22px 90px}.head{display:flex;justify-content:space-between;gap:14px;align-items:flex-start}.controls{display:flex;gap:10px;flex-wrap:wrap}.controls select{padding:12px 14px;border:1px solid #dce5ef;border-radius:12px}.summary{display:grid;grid-template-columns:repeat(4,1fr);gap:12px;margin:18px 0}.summary article,.tableCard{background:#fff;border:1px solid #e6edf5;border-radius:18px;padding:18px}.summary strong{display:block;font-size:28px;color:#1477e6}.row{display:grid;grid-template-columns:70px 1fr 110px 110px 100px;gap:10px;padding:12px 0;border-bottom:1px solid #edf2f7;align-items:center}.tie{display:inline-block;padding:2px 7px;border-radius:999px;background:#fff4db;color:#8a5800;font-size:10px;font-weight:900}@media(max-width:760px){.head{flex-direction:column}.summary{grid-template-columns:1fr 1fr}.row{grid-template-columns:48px 1fr}.row span:nth-child(n+3){grid-column:2}}</style></head><body><header class="header"><a class="brand" href="/admin/rankings"><div class="crown">♛</div><div><strong>TCI TOP 10</strong><span>Ranking History</span></div></a><div class="actions" data-member-actions></div></header><main class="wrap"><div class="head"><div><span class="pill">RANKING ARCHIVE</span><h1>Ranking Period History</h1><p class="small">Review draft, published, and archived ranking snapshots.</p></div><div class="controls"><select id="periodSelect"></select><a class="btn light" href="/admin/rankings">Ranking Manager</a><button class="btn primary" id="exportBtn">Export CSV</button></div></div><p id="status" class="small">Checking administrator access...</p><section id="content" hidden><div class="summary"><article><strong id="entryCount">0</strong><span>Entries</span></article><article><strong id="voteTotal">0</strong><span>Total selections</span></article><article><strong id="tieCount">0</strong><span>Tied entries</span></article><article><strong id="periodStatus">—</strong><span>Status</span></article></div><section class="tableCard"><div id="periodMeta" class="small"></div><div id="rows"></div></section></section></main><script>const db=()=>window.tciDb;const esc=v=>String(v??'').replace(/[&<>'"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;',"'":'&#39;','"':'&quot;'}[c]));let periods=[],results=[];window.addEventListener('DOMContentLoaded',init);async function init(){const session=(await db().auth.getSession()).data.session;if(!session){location.href='/auth?mode=login&next='+encodeURIComponent(location.pathname+location.search);return}const roles=await db().from('user_roles').select('role').eq('user_id',session.user.id);if(!(roles.data||[]).some(r=>['administrator','super_administrator'].includes(r.role))){document.getElementById('status').textContent='Administrator access is required.';return}document.getElementById('content').hidden=false;const [p,r]=await Promise.all([db().from('ranking_periods').select('*,polls(title)').order('created_at',{ascending:false}),db().from('ranking_results').select('ranking_period_id,position,previous_position,vote_count,score,movement,is_tied,poll_options(label)').order('position')]);periods=p.data||[];results=r.data||[];const select=document.getElementById('periodSelect');select.innerHTML=periods.map(x=>`<option value="${x.id}">${esc(x.polls?.title||'Poll')} — ${esc(x.title)}</option>`).join('');const requested=Number(new URLSearchParams(location.search).get('period'));if(requested&&periods.some(x=>x.id===requested))select.value=String(requested);select.onchange=render;document.getElementById('exportBtn').onclick=exportCsv;render()}function current(){return periods.find(x=>x.id===Number(document.getElementById('periodSelect').value))}function render(){const period=current();if(!period){document.getElementById('status').textContent='No ranking periods found.';return}const rows=results.filter(r=>r.ranking_period_id===period.id);document.getElementById('entryCount').textContent=rows.length;document.getElementById('voteTotal').textContent=rows.reduce((n,r)=>n+r.vote_count,0);document.getElementById('tieCount').textContent=rows.filter(r=>r.is_tied).length;document.getElementById('periodStatus').textContent=period.status;document.getElementById('periodMeta').innerHTML=`<strong>${esc(period.polls?.title||'Poll')} — ${esc(period.title)}</strong><br>${esc(period.period_key)} · Created ${new Date(period.created_at).toLocaleString()}${period.reviewed_at?` · Reviewed ${new Date(period.reviewed_at).toLocaleString()}`:''}${period.published_at?` · Published ${new Date(period.published_at).toLocaleString()}`:''}${period.review_notes?`<br>Review notes: ${esc(period.review_notes)}`:''}`;document.getElementById('rows').innerHTML=rows.map(r=>`<div class="row"><strong>#${r.position}</strong><span>${esc(r.poll_options?.label||'Entry')} ${r.is_tied?'<span class="tie">TIED</span>':''}</span><span>${r.vote_count} vote${r.vote_count===1?'':'s'}</span><span>Score ${Number(r.score).toFixed(1)}</span><span>${r.previous_position?'Prev #'+r.previous_position:r.movement==='new'?'New':'—'}</span></div>`).join('')||'<p class="small">No calculated results for this period.</p>';document.getElementById('status').textContent='Ranking history loaded.'}function exportCsv(){const period=current();if(!period)return;const rows=results.filter(r=>r.ranking_period_id===period.id),data=[['Poll','Period','Period Key','Status','Position','Entry','Votes','Score','Previous Position','Movement','Tied','Created At','Reviewed At','Published At','Review Notes']];rows.forEach(r=>data.push([period.polls?.title||'',period.title,period.period_key,period.status,r.position,r.poll_options?.label||'',r.vote_count,r.score,r.previous_position||'',r.movement,r.is_tied?'Yes':'No',period.created_at,period.reviewed_at||'',period.published_at||'',period.review_notes||'']));const csv=data.map(row=>row.map(v=>'"'+String(v??'').replace(/"/g,'""')+'"').join(',')).join('\n');const blob=new Blob([csv],{type:'text/csv;charset=utf-8'}),url=URL.createObjectURL(blob),a=document.createElement('a');a.href=url;a.download=(period.title.toLowerCase().replace(/[^a-z0-9]+/g,'-')||'ranking-history')+'.csv';a.click();URL.revokeObjectURL(url)}</script></body></html>
