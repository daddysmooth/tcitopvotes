<!doctype html><html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Winners Audit | TCI Top 10</title><link rel="stylesheet" href="/styles.css"><link rel="stylesheet" href="/admin/admin.css"><script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script><script src="/app.js" defer></script><style>.wrap{max-width:1180px;margin:auto;padding:34px 24px 90px}.head{display:flex;justify-content:space-between;gap:16px;align-items:center}.controls{display:flex;gap:10px;flex-wrap:wrap}.stats{display:grid;grid-template-columns:repeat(4,1fr);gap:14px;margin:20px 0}.stats article,.card{background:#fff;border:1px solid #e6edf5;border-radius:18px;padding:18px}.stats strong{display:block;font-size:30px;color:#1477e6}.auditRow{display:grid;grid-template-columns:1.2fr .9fr .8fr .8fr;gap:14px;align-items:center;padding:14px 0;border-bottom:1px solid #edf2f7}.tag{display:inline-block;padding:4px 9px;border-radius:999px;font-size:11px;font-weight:900;text-transform:uppercase}.pass{background:#e6f6ed;color:#126a40}.warn{background:#fff4db;color:#8a5800}.fail{background:#fde9e7;color:#a31919}.small{color:#62748a}@media(max-width:850px){.stats{grid-template-columns:repeat(2,1fr)}.auditRow{grid-template-columns:1fr}.head{align-items:flex-start;flex-direction:column}}@media(max-width:560px){.stats{grid-template-columns:1fr}}</style></head><body><main class="adminPage"><header class="header"><a class="brand" href="/"><div class="crown">♛</div><div><strong>TCI TOP 10</strong><span>Winners Audit</span></div></a><div class="actions" data-member-actions></div></header><section class="wrap"><div class="head"><div><span class="pill">RANKING INTEGRITY</span><h1>Published Winners Audit</h1><p class="small">Verify that each published ranking period has exactly one matching archived winner.</p></div><div class="controls"><button class="btn light" id="refreshBtn">Refresh Audit</button><a class="btn light" href="/admin/rankings">Ranking Manager</a><a class="btn light" href="/rankings/winners">Public Winners</a></div></div><p id="status" class="small">Checking administrator access...</p><section id="content" hidden><div class="stats"><article><strong id="publishedCount">0</strong><span>Published periods</span></article><article><strong id="winnerCount">0</strong><span>Winner records</span></article><article><strong id="matchCount">0</strong><span>Verified matches</span></article><article><strong id="issueCount">0</strong><span>Issues</span></article></div><div class="card"><div id="auditList"></div></div></section></section></main><script>const db=()=>window.tciDb;const esc=v=>String(v??'').replace(/[&<>'"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;',"'":'&#39;','"':'&quot;'}[c]));let periods=[],results=[],winners=[];window.addEventListener('DOMContentLoaded',init);async function init(){const session=(await db().auth.getSession()).data.session;if(!session){location.href='/auth?mode=login&next=%2Fadmin%2Frankings%2Fwinners-audit';return}const roles=await db().from('user_roles').select('role').eq('user_id',session.user.id);if(!(roles.data||[]).some(r=>['administrator','super_administrator'].includes(r.role))){document.getElementById('status').textContent='Administrator access is required.';return}document.getElementById('content').hidden=false;await loadAudit()}async function loadAudit(){document.getElementById('status').textContent='Running winners audit...';const [p,r,w]=await Promise.all([db().from('ranking_periods').select('id,poll_id,title,period_key,status,published_at,polls(title)').eq('status','published').order('published_at',{ascending:false}),db().from('ranking_results').select('ranking_period_id,position,poll_option_id,listing_id,vote_count,score,is_tied,poll_options(label),listings(name)').eq('position',1),db().from('ranking_winners').select('*').order('published_at',{ascending:false})]);periods=p.data||[];results=r.data||[];winners=w.data||[];render()}function render(){let verified=0,issues=0;const rows=periods.map(period=>{const expected=results.find(x=>x.ranking_period_id===period.id);const archived=winners.filter(x=>x.ranking_period_id===period.id);let state='pass',label='Verified',detail='Winner archive matches the published first-place result.';if(!expected){state='fail';label='Missing result';detail='Published period has no position #1 ranking result.'}else if(archived.length===0){state='fail';label='Missing winner';detail='Published period has no archived winner record.'}else if(archived.length>1){state='fail';label='Duplicate winners';detail=`${archived.length} winner records exist for this period.`}else{const winner=archived[0];const name=expected.listings?.name||expected.poll_options?.label||'';const mismatches=[];if(winner.poll_option_id!==expected.poll_option_id)mismatches.push('poll option');if((winner.listing_id||null)!==(expected.listing_id||null))mismatches.push('listing');if(winner.winner_name!==name)mismatches.push('winner name');if(Number(winner.vote_count)!==Number(expected.vote_count))mismatches.push('vote count');if(Number(winner.score)!==Number(expected.score))mismatches.push('score');if(Boolean(winner.was_tied)!==Boolean(expected.is_tied))mismatches.push('tie status');if(mismatches.length){state='warn';label='Mismatch';detail='Mismatch detected in: '+mismatches.join(', ')+'.'}}if(state==='pass')verified++;else issues++;const expectedName=expected?(expected.listings?.name||expected.poll_options?.label||'Unknown'):'—';const archivedName=archived[0]?.winner_name||'—';return `<article class="auditRow"><div><strong>${esc(period.polls?.title||'Poll')} — ${esc(period.title)}</strong><div class="small">${esc(period.period_key)}${period.published_at?' · Published '+new Date(period.published_at).toLocaleString():''}</div></div><div><span class="tag ${state}">${esc(label)}</span><div class="small">${esc(detail)}</div></div><div><strong>Expected</strong><div>${esc(expectedName)}</div><div class="small">${expected?expected.vote_count+' votes · '+Number(expected.score).toFixed(1):'No result'}</div></div><div><strong>Archived</strong><div>${esc(archivedName)}</div><div class="small">${archived[0]?archived[0].vote_count+' votes · '+Number(archived[0].score).toFixed(1):'No record'}</div></div></article>`}).join('');const orphaned=winners.filter(w=>!periods.some(p=>p.id===w.ranking_period_id));issues+=orphaned.length;document.getElementById('publishedCount').textContent=periods.length;document.getElementById('winnerCount').textContent=winners.length;document.getElementById('matchCount').textContent=verified;document.getElementById('issueCount').textContent=issues;document.getElementById('auditList').innerHTML=rows||'<p class="small">No published ranking periods exist yet.</p>';if(orphaned.length){document.getElementById('auditList').innerHTML+=`<h2>Orphaned Winner Records</h2>${orphaned.map(w=>`<div class="auditRow"><div><strong>${esc(w.winner_name)}</strong><div class="small">Period ID ${w.ranking_period_id}</div></div><div><span class="tag fail">Orphaned</span><div class="small">Winner record is not linked to a currently published ranking period.</div></div><div>${esc(w.period_title)}</div><div>${esc(w.period_key)}</div></div>`).join('')}`;}document.getElementById('status').textContent=issues?`Audit complete with ${issues} issue${issues===1?'':'s'}.`:`Audit complete. ${verified} published winner record${verified===1?'':'s'} verified.`}document.getElementById('refreshBtn').onclick=loadAudit;</script></body></html>
