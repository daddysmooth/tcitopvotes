<!doctype html><html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Vote Integrity | TCI Top 10 Admin</title><meta name="robots" content="noindex,nofollow"><link rel="stylesheet" href="/styles.css"><link rel="stylesheet" href="/admin/admin.css"><script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script><script src="/app.js" defer></script><style>.wrap{max-width:1120px;margin:auto;padding:24px 18px 90px}.hero{background:linear-gradient(135deg,#071b34,#1477e6);color:#fff;border-radius:24px;padding:28px}.toolbar{display:grid;grid-template-columns:1fr auto auto;gap:10px;margin:18px 0}.toolbar select{min-height:46px;border:1px solid #dce5ef;border-radius:12px;padding:10px 12px;background:#fff}.stats{display:grid;grid-template-columns:repeat(4,1fr);gap:10px;margin:16px 0}.stat{background:#fff;border:1px solid #e6edf5;border-radius:16px;padding:16px}.stat strong{display:block;font-size:28px;color:#1477e6}.cases{display:grid;gap:14px}.case{background:#fff;border:1px solid #e6edf5;border-radius:18px;padding:18px}.caseHead{display:flex;justify-content:space-between;gap:12px;align-items:flex-start}.badge{display:inline-flex;padding:4px 8px;border-radius:999px;font-size:11px;font-weight:900;text-transform:uppercase}.badge.open{background:#fff4db;color:#8a5800}.badge.cleared{background:#e8f7ef;color:#15834d}.badge.excluded{background:#fdecec;color:#b42318}.risk{font-size:24px;font-weight:900}.risk.high{color:#b42318}.risk.medium{color:#a05a00}.risk.low{color:#15834d}.details{background:#f7f9fc;border:1px solid #e6edf5;border-radius:12px;padding:12px;margin:12px 0;overflow-wrap:anywhere}.actions{display:grid;grid-template-columns:1fr auto auto;gap:8px}.actions input{border:1px solid #dce5ef;border-radius:12px;padding:11px}.empty{background:#fff;border:1px solid #e6edf5;border-radius:18px;padding:28px;text-align:center}@media(max-width:760px){.wrap{padding:14px 10px 82px}.hero{padding:21px 17px;border-radius:20px}.toolbar{grid-template-columns:1fr}.stats{grid-template-columns:1fr 1fr}.caseHead{display:grid}.actions{grid-template-columns:1fr}.actions .btn{width:100%}}</style></head><body class="adminPage"><header class="header"><a class="brand" href="/"><div class="crown">♛</div><div><strong>TCI TOP 10</strong><span>Vote Integrity</span></div></a><nav class="nav"><a href="/admin">Dashboard</a><a href="/admin/vote-integrity">Integrity</a><a href="/admin/rankings">Rankings</a><a href="/admin/poll-suggestions">Suggestions</a></nav><div class="actions" data-member-actions></div></header><main class="wrap"><section class="hero"><span class="pill">VERSION 2.0</span><h1>Vote Integrity Review</h1><p>Generate anomaly cases, inspect the evidence and decide whether ballots remain eligible for official rankings.</p></section><div class="toolbar"><select id="pollFilter"><option value="">All polls</option></select><button id="scanBtn" class="btn primary" type="button">Run Integrity Scan</button><button id="refreshBtn" class="btn light" type="button">Refresh</button></div><div class="stats"><article class="stat"><strong id="openCount">0</strong><span>Open</span></article><article class="stat"><strong id="clearedCount">0</strong><span>Cleared</span></article><article class="stat"><strong id="excludedCount">0</strong><span>Excluded</span></article><article class="stat"><strong id="highRiskCount">0</strong><span>High Risk</span></article></div><p id="status" class="small">Checking administrator access...</p><section id="cases" class="cases"></section></main><script>const esc=v=>String(v??'').replace(/[&<>'"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;',"'":'&#39;','"':'&quot;'}[c]));let allCases=[];async function requireAdmin(){const{data:{session}}=await window.tciDb.auth.getSession();if(!session){location.href='/auth?mode=login&next='+encodeURIComponent(location.pathname);return false}const{data,error}=await window.tciDb.rpc('is_tci_admin',{target_user_id:session.user.id});if(error||!data){document.getElementById('status').textContent='Administrator access is required.';return false}return true}async function loadPolls(){const{data}=await window.tciDb.from('polls').select('id,title').order('title');document.getElementById('pollFilter').innerHTML='<option value="">All polls</option>'+(data||[]).map(p=>`<option value="${p.id}">${esc(p.title)}</option>`).join('')}function riskClass(score){return score>=70?'high':score>=40?'medium':'low'}function render(){const pollId=Number(document.getElementById('pollFilter').value);const rows=pollId?allCases.filter(x=>x.poll_id===pollId):allCases;document.getElementById('openCount').textContent=rows.filter(x=>x.status==='open').length;document.getElementById('clearedCount').textContent=rows.filter(x=>x.status==='cleared').length;document.getElementById('excludedCount').textContent=rows.filter(x=>x.status==='excluded').length;document.getElementById('highRiskCount').textContent=rows.filter(x=>x.risk_score>=70).length;document.getElementById('status').textContent=`${rows.length} integrity case${rows.length===1?'':'s'} in this view.`;const host=document.getElementById('cases');host.innerHTML=rows.length?rows.map(item=>`<article class="case" data-id="${item.id}"><div class="caseHead"><div><span class="badge ${esc(item.status)}">${esc(item.status)}</span><h2>${esc(item.case_type.replaceAll('_',' '))}</h2><div class="small">${esc(item.polls?.title||'Poll')} · Ballot #${item.ballot_id||'—'} · ${new Date(item.created_at).toLocaleString()}</div></div><div class="risk ${riskClass(item.risk_score)}">${item.risk_score}/100</div></div><div class="details"><strong>Evidence</strong><pre style="white-space:pre-wrap;margin:8px 0 0">${esc(JSON.stringify(item.details||{},null,2))}</pre></div>${item.review_notes?`<p class="small"><strong>Review note:</strong> ${esc(item.review_notes)}</p>`:''}${item.status==='open'?`<div class="actions"><input data-notes placeholder="Review notes"><button class="btn light" data-decision="cleared">Clear Ballot</button><button class="btn primary" data-decision="excluded">Exclude Ballot</button></div>`:''}</article>`).join(''):'<div class="empty"><h2>No integrity cases found</h2><p class="small">Run a scan to check recent voting patterns.</p></div>';host.querySelectorAll('[data-decision]').forEach(button=>button.onclick=()=>review(button.closest('.case'),button.dataset.decision))}async function loadCases(){const{data,error}=await window.tciDb.from('vote_integrity_cases').select('id,poll_id,ballot_id,case_type,risk_score,details,status,review_notes,created_at,polls(title)').order('created_at',{ascending:false});if(error){document.getElementById('status').textContent=error.message;return}allCases=data||[];render()}async function scan(){const button=document.getElementById('scanBtn');button.disabled=true;button.textContent='Scanning...';const pollId=Number(document.getElementById('pollFilter').value)||null;const{data,error}=await window.tciDb.rpc('generate_vote_integrity_cases',{target_poll_id:pollId});button.disabled=false;button.textContent='Run Integrity Scan';if(error){alert(error.message);return}alert(`${data} new integrity case${data===1?'':'s'} created.`);loadCases()}async function review(card,decision){const id=Number(card.dataset.id),notes=card.querySelector('[data-notes]')?.value.trim()||null;const message=decision==='excluded'?'Exclude this ballot from official rankings?':'Clear this ballot as eligible?';if(!confirm(message))return;const{error}=await window.tciDb.rpc('review_vote_integrity_case',{target_case_id:id,target_decision:decision,target_notes:notes});if(error){alert(error.message);return}loadCases()}document.getElementById('pollFilter').onchange=render;document.getElementById('scanBtn').onclick=scan;document.getElementById('refreshBtn').onclick=loadCases;window.addEventListener('DOMContentLoaded',async()=>{if(await requireAdmin()){await loadPolls();await loadCases()}});</script></body></html>
