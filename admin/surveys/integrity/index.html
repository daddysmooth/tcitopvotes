<!doctype html><html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Survey Integrity Audit | TCI Top 10</title><link rel="stylesheet" href="/styles.css"><link rel="stylesheet" href="/admin/admin.css"><script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script><script src="/app.js" defer></script><style>.wrap{max-width:1180px;margin:auto;padding:34px 24px 90px}.head{display:flex;justify-content:space-between;gap:16px;align-items:center}.stats{display:grid;grid-template-columns:repeat(4,1fr);gap:14px;margin:20px 0}.stats article,.card{background:#fff;border:1px solid #e6edf5;border-radius:18px;padding:18px}.stats strong{display:block;font-size:30px;color:#1477e6}.issue{padding:14px 0;border-bottom:1px solid #edf2f7}.pass{color:#15834d;font-weight:800}.warn{color:#a05a00;font-weight:800}.fail{color:#b42318;font-weight:800}.tag{display:inline-block;padding:3px 8px;border-radius:999px;font-size:11px;font-weight:900;text-transform:uppercase}.tag.pass{background:#dff3e8}.tag.warn{background:#fff1cf}.tag.fail{background:#fde7e7}@media(max-width:820px){.head{align-items:flex-start;flex-direction:column}.stats{grid-template-columns:repeat(2,1fr)}}@media(max-width:520px){.stats{grid-template-columns:1fr}}</style></head><body><main class="adminPage"><header class="header"><a class="brand" href="/"><div class="crown">♛</div><div><strong>TCI TOP 10</strong><span>Survey Integrity</span></div></a><div class="actions" data-member-actions></div></header><section class="wrap"><div class="head"><div><span class="pill">SURVEY QA</span><h1>Survey Integrity Audit</h1><p class="small">Detect consent, required-answer, option-reference, and response consistency issues.</p></div><div><button id="refreshBtn" class="btn primary">Run Audit</button> <a class="btn light" href="/admin/surveys">Survey Manager</a></div></div><p id="status" class="small">Checking administrator access...</p><section id="content" hidden><div class="stats"><article><strong id="surveyCount">0</strong><span>Surveys checked</span></article><article><strong id="responseCount">0</strong><span>Responses checked</span></article><article><strong id="passCount">0</strong><span>Passed checks</span></article><article><strong id="issueCount">0</strong><span>Issues found</span></article></div><div class="card"><h2>Audit Findings</h2><div id="findings"></div></div></section></section></main><script>const db=()=>window.tciDb;const esc=v=>String(v??'').replace(/[&<>'"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;',"'":'&#39;','"':'&quot;'}[c]));window.addEventListener('DOMContentLoaded',init);async function init(){const session=(await db().auth.getSession()).data.session;if(!session){location.href='/auth?mode=login&next=%2Fadmin%2Fsurveys%2Fintegrity';return}const roles=await db().from('user_roles').select('role').eq('user_id',session.user.id);if(!(roles.data||[]).some(r=>['administrator','super_administrator'].includes(r.role))){document.getElementById('status').textContent='Administrator access is required.';return}document.getElementById('content').hidden=false;await runAudit()}async function runAudit(){document.getElementById('status').textContent='Running survey integrity checks...';const [s,q,o,r,a]=await Promise.all([db().from('surveys').select('id,title,require_consent,status'),db().from('survey_questions').select('id,survey_id,prompt,question_type,is_required'),db().from('survey_question_options').select('id,question_id'),db().from('survey_responses').select('*'),db().from('survey_answers').select('*')]);const errors=[s.error,q.error,o.error,r.error,a.error].filter(Boolean);if(errors.length){document.getElementById('status').textContent=errors[0].message;return}const surveys=s.data||[],questions=q.data||[],options=o.data||[],responses=r.data||[],answers=a.data||[];const findings=[];let passes=0;for(const survey of surveys){const sr=responses.filter(x=>x.survey_id===survey.id),sq=questions.filter(x=>x.survey_id===survey.id),required=sq.filter(x=>x.is_required);let surveyIssues=0;for(const response of sr){if(survey.require_consent&&!response.consent_acknowledged){findings.push({level:'fail',survey:survey.title,response:response.id,text:'Consent is required but no acknowledgement is recorded.'});surveyIssues++}if(response.consent_acknowledged&&(!response.consent_acknowledged_at||!response.consent_text_snapshot)){findings.push({level:'warn',survey:survey.title,response:response.id,text:'Consent acknowledgement exists but timestamp or statement snapshot is missing.'});surveyIssues++}for(const question of required){const qa=answers.filter(x=>x.response_id===response.id&&x.question_id===question.id);const valid=qa.some(x=>x.option_id||x.answer_number!==null&&x.answer_number!==undefined||x.answer_boolean!==null&&x.answer_boolean!==undefined||String(x.answer_text||'').trim());if(!valid){findings.push({level:'fail',survey:survey.title,response:response.id,text:`Required question has no answer: ${question.prompt}`});surveyIssues++}}const ra=answers.filter(x=>x.response_id===response.id);for(const ans of ra){const question=sq.find(x=>x.id===ans.question_id);if(!question){findings.push({level:'fail',survey:survey.title,response:response.id,text:`Answer ${ans.id} references a question outside this survey.`});surveyIssues++;continue}if(ans.option_id&&!options.some(x=>x.id===ans.option_id&&x.question_id===question.id)){findings.push({level:'fail',survey:survey.title,response:response.id,text:`Answer ${ans.id} references an invalid option.`});surveyIssues++}}}if(!surveyIssues){passes++;findings.push({level:'pass',survey:survey.title,text:`All ${sr.length} response${sr.length===1?'':'s'} passed integrity checks.`})}}const orphanAnswers=answers.filter(x=>!responses.some(r=>r.id===x.response_id));orphanAnswers.forEach(x=>findings.push({level:'fail',survey:'Database',response:x.response_id,text:`Answer ${x.id} has no matching response.`}));document.getElementById('surveyCount').textContent=surveys.length;document.getElementById('responseCount').textContent=responses.length;document.getElementById('passCount').textContent=passes;document.getElementById('issueCount').textContent=findings.filter(x=>x.level!=='pass').length;document.getElementById('findings').innerHTML=findings.map(x=>`<div class="issue"><span class="tag ${x.level}">${x.level}</span> <strong>${esc(x.survey)}</strong>${x.response?`<div class="small">Response ${esc(x.response)}</div>`:''}<div>${esc(x.text)}</div></div>`).join('')||'<p class="pass">No integrity issues found.</p>';document.getElementById('status').textContent='Survey integrity audit complete.'}document.getElementById('refreshBtn').onclick=runAudit;</script></body></html>
