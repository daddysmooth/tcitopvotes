<!doctype html><html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Survey Manager | TCI Top 10</title><link rel="stylesheet" href="/styles.css"><link rel="stylesheet" href="/admin/admin.css"><script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script><script src="/app.js" defer></script><style>.surveyAdmin{max-width:1180px;margin:auto;padding:34px 24px 90px}.surveyToolbar{display:flex;justify-content:space-between;gap:16px;align-items:center;margin-bottom:20px}.surveyGrid{display:grid;grid-template-columns:.8fr 1.2fr;gap:22px}.builderCard{background:#fff;border:1px solid #e6edf5;border-radius:20px;padding:22px}.builderCard form{display:grid;gap:10px}.builderCard input,.builderCard select,.builderCard textarea{width:100%;padding:12px 14px;border:1px solid #dce5ef;border-radius:12px}.questionRow{border:1px solid #e6edf5;border-radius:16px;padding:14px;margin:10px 0}.questionActions{display:flex;gap:8px;flex-wrap:wrap;margin-top:10px}.optionBuilder{display:grid;grid-template-columns:1fr auto;gap:8px;margin-top:10px}.surveyListItem{display:flex;justify-content:space-between;gap:12px;align-items:center;padding:14px 0;border-bottom:1px solid #e6edf5}.surveyListActions{display:flex;gap:6px;flex-wrap:wrap;justify-content:flex-end}@media(max-width:850px){.surveyGrid{grid-template-columns:1fr}.surveyToolbar{align-items:flex-start;flex-direction:column}.surveyListItem{align-items:flex-start;flex-direction:column}.surveyListActions{justify-content:flex-start}}</style></head><body><main class="adminPage"><header class="header"><a class="brand" href="/"><div class="crown">♛</div><div><strong>TCI TOP 10</strong><span>Survey Manager</span></div></a><div class="actions" data-member-actions></div></header><section class="surveyAdmin"><div class="surveyToolbar"><div><span class="pill">SURVEY BUILDER</span><h1>Create and Manage Surveys</h1><p class="small">Build structured community, visitor, and business feedback forms.</p></div><div><a class="btn light" href="/admin">Poll Admin</a> <a class="btn light" href="/surveys">Public Surveys</a> <a class="btn primary" href="/admin/surveys/results">Survey Reports</a></div></div><p id="status" class="small">Checking administrator access...</p><div id="content" hidden><div class="surveyGrid"><section class="builderCard"><h2>Create Survey</h2><form id="surveyForm"><label>Title</label><input id="title" required maxlength="140"><label>Category</label><select id="category"></select><label>Description</label><textarea id="description" rows="4"></textarea><label>Access</label><select id="access"><option value="member">Members only</option><option value="anonymous">Anonymous or members</option></select><div class="formRow"><div><label>Opens</label><input id="opens" type="datetime-local"></div><div><label>Closes</label><input id="closes" type="datetime-local"></div></div><label>Status</label><select id="surveyStatus"><option value="draft">Draft</option><option value="published">Published</option></select><button class="btn primary" type="submit">Create Survey</button><p id="surveyMessage" class="small"></p></form><hr><h2>Existing Surveys</h2><div id="surveyList"></div></section><section class="builderCard"><div class="cardHead"><div><h2>Questions</h2><p class="small">Select a survey and add questions.</p></div><select id="surveySelect"></select></div><form id="questionForm"><label>Question</label><input id="prompt" required><div class="formRow"><div><label>Type</label><select id="type"><option value="single_choice">Single choice</option><option value="multiple_choice">Multiple choice</option><option value="dropdown">Dropdown</option><option value="rating">Rating</option><option value="yes_no">Yes / No</option><option value="short_text">Short text</option><option value="long_text">Long text</option></select></div><div><label>Required</label><select id="required"><option value="false">Optional</option><option value="true">Required</option></select></div></div><div id="ratingFields" class="formRow" hidden><div><label>Minimum</label><input id="minValue" type="number" value="1"></div><div><label>Maximum</label><input id="maxValue" type="number" value="5"></div></div><button class="btn primary" type="submit">Add Question</button><p id="questionMessage" class="small"></p></form><div id="questionList"></div></section></div></div></section></main><script>const slugify=v=>v.toLowerCase().trim().replace(/&/g,'and').replace(/[^a-z0-9]+/g,'-').replace(/^-|-$/g,'');let session,surveys=[],categories=[];const db=()=>window.tciDb;window.addEventListener('DOMContentLoaded',init);async function init(){const s=await db().auth.getSession();session=s.data.session;if(!session){location.href='/auth?mode=login&next=%2Fadmin%2Fsurveys';return}const roles=await db().from('user_roles').select('role').eq('user_id',session.user.id);if(!(roles.data||[]).some(r=>['administrator','super_administrator'].includes(r.role))){document.getElementById('status').textContent='Administrator access is required.';return}document.getElementById('status').textContent='Administrator access confirmed.';document.getElementById('content').hidden=false;await loadAll()}async function loadAll(){const [c,s]=await Promise.all([db().from('categories').select('id,name').eq('status','active').order('name'),db().from('surveys').select('*').order('created_at',{ascending:false})]);categories=c.data||[];surveys=s.data||[];document.getElementById('category').innerHTML='<option value="">No category</option>'+categories.map(x=>`<option value="${x.id}">${x.name}</option>`).join('');document.getElementById('surveySelect').innerHTML=surveys.map(x=>`<option value="${x.id}">${x.title}</option>`).join('');document.getElementById('surveyList').innerHTML=surveys.map(x=>`<div class="surveyListItem"><div><strong>${x.title}</strong><div class="small">${x.status} · ${x.access_mode}</div></div><div class="surveyListActions"><a class="btn light" href="/admin/surveys/edit?id=${x.id}">Edit</a><a class="btn light" href="/surveys/${x.slug}">View</a><a class="btn light" href="/admin/surveys/results?survey=${x.id}">Reports</a><button class="btn light" type="button" onclick="toggleSurvey(${x.id},'${x.status}')">${x.status==='published'?'Close':'Publish'}</button></div></div>`).join('')||'<p class="small">No surveys yet.</p>';await loadQuestions()}document.getElementById('surveyForm').onsubmit=async e=>{e.preventDefault();const title=document.getElementById('title').value.trim(),category_id=document.getElementById('category').value||null,description=document.getElementById('description').value.trim()||null,access_mode=document.getElementById('access').value,status=document.getElementById('surveyStatus').value,opens=document.getElementById('opens').value,closes=document.getElementById('closes').value;const{error}=await db().from('surveys').insert({title,slug:slugify(title),category_id:category_id?Number(category_id):null,description,access_mode,status,opens_at:opens?new Date(opens).toISOString():null,closes_at:closes?new Date(closes).toISOString():null,created_by:session.user.id});document.getElementById('surveyMessage').textContent=error?error.message:'Survey created.';if(!error){e.target.reset();await loadAll()}};async function toggleSurvey(id,status){const next=status==='published'?'closed':'published';const{error}=await db().from('surveys').update({status:next,updated_at:new Date().toISOString()}).eq('id',id);document.getElementById('status').textContent=error?error.message:`Survey changed to ${next}.`;if(!error)await loadAll()}document.getElementById('type').onchange=e=>document.getElementById('ratingFields').hidden=e.target.value!=='rating';document.getElementById('surveySelect').onchange=loadQuestions;document.getElementById('questionForm').onsubmit=async e=>{e.preventDefault();const survey_id=Number(document.getElementById('surveySelect').value),prompt=document.getElementById('prompt').value.trim(),question_type=document.getElementById('type').value,is_required=document.getElementById('required').value==='true',min_value=question_type==='rating'?Number(document.getElementById('minValue').value):null,max_value=question_type==='rating'?Number(document.getElementById('maxValue').value):null;const{error}=await db().from('survey_questions').insert({survey_id,prompt,question_type,is_required,min_value,max_value,position:Date.now()}).select().single();document.getElementById('questionMessage').textContent=error?error.message:'Question added.';if(!error){e.target.reset();document.getElementById('ratingFields').hidden=true;await loadQuestions()}};async function loadQuestions(){const surveyId=Number(document.getElementById('surveySelect').value);if(!surveyId){document.getElementById('questionList').innerHTML='';return}const{data}=await db().from('survey_questions').select('*,survey_question_options(*)').eq('survey_id',surveyId).order('position');document.getElementById('questionList').innerHTML=(data||[]).map(q=>`<div class="questionRow"><strong>${q.prompt}</strong><div class="small">${q.question_type} · ${q.is_required?'Required':'Optional'}</div>${['single_choice','multiple_choice','dropdown'].includes(q.question_type)?`<div class="small">${(q.survey_question_options||[]).map(o=>o.label).join(', ')||'No options yet'}</div><div class="optionBuilder"><input id="opt-${q.id}" placeholder="Add option"><button class="btn light" type="button" onclick="addOption(${q.id})">Add</button></div>`:''}<div class="questionActions"><a class="btn light" href="/admin/surveys/edit?id=${surveyId}">Advanced Edit</a><button class="btn light" type="button" onclick="deleteQuestion(${q.id})">Delete Question</button></div></div>`).join('')||'<p class="small">No questions yet.</p>'}async function addOption(question_id){const input=document.getElementById('opt-'+question_id),label=input.value.trim();if(!label)return;const{error}=await db().from('survey_question_options').insert({question_id,label,value:slugify(label),position:Date.now()});document.getElementById('questionMessage').textContent=error?error.message:'Option added.';if(!error)await loadQuestions()}async function deleteQuestion(id){if(!confirm('Delete this question?'))return;const{error}=await db().from('survey_questions').delete().eq('id',id);document.getElementById('questionMessage').textContent=error?error.message:'Question deleted.';if(!error)await loadQuestions()}</script></body></html>
