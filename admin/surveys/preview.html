<!doctype html><html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Survey Preview | TCI Top 10</title><link rel="stylesheet" href="/styles.css"><link rel="stylesheet" href="/admin/admin.css"><script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script><script src="/app.js" defer></script><style>.wrap{max-width:900px;margin:auto;padding:34px 22px 90px}.previewBanner{background:#fff4db;border:1px solid #f0cf86;border-radius:16px;padding:14px 16px;margin-bottom:18px}.surveyHeader{background:linear-gradient(135deg,#092a55,#1477e6);color:#fff;border-radius:24px;padding:32px;margin-bottom:20px}.question{background:#fff;border:1px solid #e6edf5;border-radius:18px;padding:20px;margin:14px 0}.question label{display:block;margin:8px 0}.question input[type=text],.question textarea,.question select{width:100%;padding:12px 14px;border:1px solid #dce5ef;border-radius:12px}.rating{display:flex;gap:8px;flex-wrap:wrap}.rating label{padding:9px 13px;border:1px solid #dce5ef;border-radius:10px}.actions{display:flex;gap:10px;flex-wrap:wrap;margin:18px 0}</style></head><body><header class="header"><a class="brand" href="/admin/surveys"><div class="crown">♛</div><div><strong>TCI TOP 10</strong><span>Survey Preview</span></div></a><div class="actions" data-member-actions></div></header><main class="wrap"><div class="previewBanner"><strong>Administrator preview only.</strong> This page does not submit responses and is not available to the public.</div><section id="surveyHeader" class="surveyHeader"><h1>Loading preview...</h1></section><div class="actions"><a class="btn light" href="/admin/surveys">Survey Manager</a><a id="editLink" class="btn primary" href="/admin/surveys">Edit Survey</a></div><p id="status" class="small">Checking administrator access...</p><section id="questions"></section></main><script>const db=()=>window.tciDb;const esc=v=>String(v??'').replace(/[&<>'"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;',"'":'&#39;','"':'&quot;'}[c]));const id=Number(new URLSearchParams(location.search).get('id'));window.addEventListener('DOMContentLoaded',init);async function init(){const session=(await db().auth.getSession()).data.session;if(!session){location.href='/auth?mode=login&next='+encodeURIComponent(location.pathname+location.search);return}const roles=await db().from('user_roles').select('role').eq('user_id',session.user.id);if(!(roles.data||[]).some(r=>['administrator','super_administrator'].includes(r.role))){document.getElementById('status').textContent='Administrator access is required.';return}if(!id){document.getElementById('status').textContent='A survey ID is required.';return}const [s,q]=await Promise.all([db().from('surveys').select('*').eq('id',id).maybeSingle(),db().from('survey_questions').select('*,survey_question_options(*)').eq('survey_id',id).order('position')]);if(s.error||!s.data){document.getElementById('status').textContent='Survey not found.';return}const survey=s.data,questions=q.data||[];document.title=`Preview: ${survey.title} | TCI Top 10`;document.getElementById('editLink').href=`/admin/surveys/edit?id=${survey.id}`;document.getElementById('surveyHeader').innerHTML=`<span class="pill">${esc(survey.status.toUpperCase())} PREVIEW</span><h1>${esc(survey.title)}</h1><p>${esc(survey.description||'No description provided.')}</p><div class="small">Access: ${esc(survey.access_mode)} · ${questions.length} questions</div>`;document.getElementById('questions').innerHTML=questions.map((x,i)=>`<article class="question"><h2>${i+1}. ${esc(x.prompt)} ${x.is_required?'<span style="color:#b42318">*</span>':''}</h2>${input(x)}</article>`).join('')||'<article class="question">No questions have been added.</article>';document.getElementById('status').textContent='Preview loaded successfully.'}function input(q){const options=(q.survey_question_options||[]).sort((a,b)=>a.position-b.position);if(q.question_type==='single_choice')return options.map(o=>`<label><input type="radio" disabled> ${esc(o.label)}</label>`).join('');if(q.question_type==='multiple_choice')return options.map(o=>`<label><input type="checkbox" disabled> ${esc(o.label)}</label>`).join('');if(q.question_type==='dropdown')return `<select disabled><option>Select an option</option>${options.map(o=>`<option>${esc(o.label)}</option>`).join('')}</select>`;if(q.question_type==='rating'){let out='<div class="rating">';for(let n=Number(q.min_value||1);n<=Number(q.max_value||5);n++)out+=`<label><input type="radio" disabled> ${n}</label>`;return out+'</div>'}if(q.question_type==='yes_no')return '<label><input type="radio" disabled> Yes</label><label><input type="radio" disabled> No</label>';if(q.question_type==='long_text')return `<textarea rows="5" disabled placeholder="${esc(q.placeholder||'Enter your response')}"></textarea>`;return `<input type="text" disabled placeholder="${esc(q.placeholder||'Enter your response')}">`}</script></body></html>
