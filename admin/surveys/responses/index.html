<!doctype html><html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Survey Responses | TCI Top 10</title><link rel="stylesheet" href="/styles.css"><link rel="stylesheet" href="/admin/admin.css"><script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script><script src="/app.js" defer></script><style>.wrap{max-width:1180px;margin:auto;padding:34px 24px 90px}.head{display:flex;justify-content:space-between;gap:16px;align-items:center}.controls{display:flex;gap:10px;flex-wrap:wrap}.controls select,.controls input{padding:12px 14px;border:1px solid #dce5ef;border-radius:12px}.grid{display:grid;grid-template-columns:.75fr 1.25fr;gap:20px;margin-top:20px}.card{background:#fff;border:1px solid #e6edf5;border-radius:18px;padding:18px}.responseItem{padding:13px 0;border-bottom:1px solid #edf2f7;cursor:pointer}.responseItem.active{background:#eef6ff}.answer{padding:13px 0;border-bottom:1px solid #edf2f7}.danger{border-color:#efb4b4!important;color:#a31919!important}@media(max-width:820px){.grid{grid-template-columns:1fr}.head{align-items:flex-start;flex-direction:column}}</style></head><body><main class="adminPage"><header class="header"><a class="brand" href="/"><div class="crown">♛</div><div><strong>TCI TOP 10</strong><span>Survey Responses</span></div></a><div class="actions" data-member-actions></div></header><section class="wrap"><div class="head"><div><span class="pill">RESPONSE MANAGEMENT</span><h1>Individual Survey Responses</h1><p class="small">Review, filter, inspect, and remove invalid or test submissions.</p></div><div class="controls"><select id="surveySelect"></select><input id="search" placeholder="Search response ID"><a class="btn light" href="/admin/surveys/results">Reports</a><a class="btn light" href="/admin/surveys">Survey Manager</a></div></div><p id="status" class="small">Checking administrator access...</p><div id="content" hidden class="grid"><section class="card"><h2>Submissions</h2><div id="responseList"></div></section><section class="card"><div class="cardHead"><div><h2>Response Details</h2><p id="detailMeta" class="small">Select a response.</p></div><button id="deleteBtn" class="btn light danger" hidden>Delete Response</button></div><div id="answerList"></div></section></div></section></main><script>const db=()=>window.tciDb;const esc=v=>String(v??'').replace(/[&<>'"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;',"'":'&#39;','"':'&quot;'}[c]));let surveys=[],responses=[],questions=[],options=[],answers=[],selected=null;window.addEventListener('DOMContentLoaded',init);async function init(){const session=(await db().auth.getSession()).data.session;if(!session){location.href='/auth?mode=login&next=%2Fadmin%2Fsurveys%2Fresponses';return}const roles=await db().from('user_roles').select('role').eq('user_id',session.user.id);if(!(roles.data||[]).some(r=>['administrator','super_administrator'].includes(r.role))){document.getElementById('status').textContent='Administrator access is required.';return}const s=await db().from('surveys').select('id,title').order('created_at',{ascending:false});surveys=s.data||[];document.getElementById('surveySelect').innerHTML=surveys.map(x=>`<option value="${x.id}">${esc(x.title)}</option>`).join('');document.getElementById('content').hidden=false;await loadResponses()}async function loadResponses(){const surveyId=Number(document.getElementById('surveySelect').value);document.getElementById('status').textContent='Loading responses...';const [r,q,o]=await Promise.all([db().from('survey_responses').select('*').eq('survey_id',surveyId).order('submitted_at',{ascending:false}),db().from('survey_questions').select('*').eq('survey_id',surveyId).order('position'),db().from('survey_question_options').select('*')]);responses=r.data||[];questions=q.data||[];options=(o.data||[]).filter(x=>questions.some(q=>q.id===x.question_id));selected=null;renderResponses();document.getElementById('answerList').innerHTML='';document.getElementById('detailMeta').textContent='Select a response.';document.getElementById('deleteBtn').hidden=true;document.getElementById('status').textContent=`${responses.length} response${responses.length===1?'':'s'} loaded.`}function renderResponses(){const term=document.getElementById('search').value.trim().toLowerCase();const filtered=responses.filter(r=>!term||r.id.toLowerCase().includes(term)||String(r.user_id||'anonymous').toLowerCase().includes(term));document.getElementById('responseList').innerHTML=filtered.map(r=>`<div class="responseItem ${selected===r.id?'active':''}" onclick="openResponse('${r.id}')"><strong>${r.user_id?'Member response':'Anonymous response'}</strong><div class="small">${new Date(r.submitted_at).toLocaleString()}</div><div class="small">${r.id}</div></div>`).join('')||'<p class="small">No matching responses.</p>'}async function openResponse(id){selected=id;renderResponses();const r=responses.find(x=>x.id===id);const a=await db().from('survey_answers').select('*').eq('response_id',id);answers=a.data||[];document.getElementById('detailMeta').textContent=`Submitted ${new Date(r.submitted_at).toLocaleString()} · ${r.user_id?'Member':'Anonymous'}`;document.getElementById('deleteBtn').hidden=false;document.getElementById('answerList').innerHTML=questions.map(q=>{const qa=answers.filter(x=>x.question_id===q.id);let value='No answer';if(qa.length){if(['single_choice','multiple_choice','dropdown'].includes(q.question_type))value=qa.map(x=>options.find(o=>o.id===x.option_id)?.label||'Unknown option').join(', ');else if(q.question_type==='rating')value=qa[0].answer_number;else if(q.question_type==='yes_no')value=qa[0].answer_boolean===true?'Yes':'No';else value=qa[0].answer_text||'No answer'}return `<div class="answer"><strong>${esc(q.prompt)}</strong><div>${esc(value)}</div></div>`}).join('')}document.getElementById('deleteBtn').onclick=async()=>{if(!selected||!confirm('Delete this response and all of its answers?'))return;const{error}=await db().from('survey_responses').delete().eq('id',selected);document.getElementById('status').textContent=error?error.message:'Response deleted.';if(!error)await loadResponses()};document.getElementById('surveySelect').onchange=loadResponses;document.getElementById('search').oninput=renderResponses;</script></body></html>
