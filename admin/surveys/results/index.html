<!doctype html><html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Survey Reports | TCI Top 10</title><link rel="stylesheet" href="/styles.css"><link rel="stylesheet" href="/admin/admin.css"><script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script><script src="/app.js" defer></script><style>.reportWrap{max-width:1180px;margin:auto;padding:34px 24px 90px}.reportHead{display:flex;justify-content:space-between;gap:16px;align-items:center;margin-bottom:22px}.reportControls{display:flex;gap:10px;flex-wrap:wrap}.reportControls select{padding:12px 14px;border:1px solid #dce5ef;border-radius:12px}.reportStats{display:grid;grid-template-columns:repeat(3,1fr);gap:14px;margin:18px 0}.reportStats article,.reportCard{background:#fff;border:1px solid #e6edf5;border-radius:18px;padding:20px}.reportStats strong{display:block;font-size:30px;color:#1477e6}.reportGrid{display:grid;gap:16px}.barRow{display:grid;grid-template-columns:minmax(120px,220px) 1fr 90px;gap:10px;align-items:center;margin:10px 0}.barTrack{height:12px;background:#edf2f7;border-radius:999px;overflow:hidden}.barFill{height:100%;background:#1477e6}.textAnswer{padding:12px 0;border-bottom:1px solid #e6edf5;white-space:pre-wrap}.empty{color:#62748a}.smallCaps{text-transform:uppercase;letter-spacing:.06em;font-size:11px;font-weight:900;color:#62748a}@media(max-width:760px){.reportHead{align-items:flex-start;flex-direction:column}.reportStats{grid-template-columns:1fr}.barRow{grid-template-columns:1fr}.barRow strong{text-align:left}}</style></head><body><main class="adminPage"><header class="header"><a class="brand" href="/"><div class="crown">♛</div><div><strong>TCI TOP 10</strong><span>Survey Reports</span></div></a><div class="actions" data-member-actions></div></header><section class="reportWrap"><div class="reportHead"><div><span class="pill">SURVEY ANALYTICS</span><h1>Survey Results</h1><p class="small">Review participation and question-by-question findings.</p></div><div class="reportControls"><select id="surveySelect"></select><button class="btn light" id="refreshBtn">Refresh</button><button class="btn primary" id="exportBtn">Export CSV</button><a class="btn light" href="/admin/surveys">Survey Builder</a></div></div><p id="status" class="small">Checking administrator access...</p><div id="reportContent" hidden><section class="reportStats"><article><strong id="responseCount">0</strong><span>Total responses</span></article><article><strong id="questionCount">0</strong><span>Questions</span></article><article><strong id="latestResponse">—</strong><span>Latest response</span></article></section><div id="reportGrid" class="reportGrid"></div></div></section></main><script>let surveys=[],questions=[],responses=[],answers=[],options=[];const db=()=>window.tciDb;const esc=v=>String(v??'').replace(/[&<>'"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;',"'":'&#39;','"':'&quot;'}[c]));window.addEventListener('DOMContentLoaded',init);async function init(){const s=(await db().auth.getSession()).data.session;if(!s){location.href='/auth?mode=login&next=%2Fadmin%2Fsurveys%2Fresults';return}const roles=await db().from('user_roles').select('role').eq('user_id',s.user.id);if(!(roles.data||[]).some(r=>['administrator','super_administrator'].includes(r.role))){document.getElementById('status').textContent='Administrator access is required.';return}document.getElementById('status').textContent='Administrator access confirmed.';document.getElementById('reportContent').hidden=false;const r=await db().from('surveys').select('id,title,status').order('created_at',{ascending:false});surveys=r.data||[];const select=document.getElementById('surveySelect');select.innerHTML=surveys.map(x=>`<option value="${x.id}">${esc(x.title)}</option>`).join('');const requested=Number(new URLSearchParams(location.search).get('survey'));if(requested&&surveys.some(x=>x.id===requested))select.value=String(requested);await loadReport()}async function loadReport(){const surveyId=Number(document.getElementById('surveySelect').value);if(!surveyId){document.getElementById('reportGrid').innerHTML='<div class="reportCard empty">No surveys found.</div>';return}document.getElementById('status').textContent='Loading survey results...';const [q,r]=await Promise.all([db().from('survey_questions').select('*').eq('survey_id',surveyId).order('position'),db().from('survey_responses').select('*').eq('survey_id',surveyId).order('submitted_at',{ascending:false})]);questions=q.data||[];responses=r.data||[];const questionIds=questions.map(x=>x.id);options=questionIds.length?(await db().from('survey_question_options').select('id,question_id,label,position').in('question_id',questionIds)).data||[]:[];const responseIds=responses.map(x=>x.id);answers=responseIds.length?(await db().from('survey_answers').select('*').in('response_id',responseIds)).data||[]:[];document.getElementById('responseCount').textContent=responses.length;document.getElementById('questionCount').textContent=questions.length;document.getElementById('latestResponse').textContent=responses[0]?new Date(responses[0].submitted_at).toLocaleDateString():'—';document.getElementById('status').textContent='Report ready. Choice percentages are calculated from respondents who answered each question.';renderReport()}function renderReport(){document.getElementById('reportGrid').innerHTML=questions.map((q,i)=>`<section class="reportCard"><div class="smallCaps">Question ${i+1} · ${esc(q.question_type)}</div><h2>${esc(q.prompt)}</h2>${renderSummary(q)}</section>`).join('')||'<div class="reportCard empty">No questions have been added to this survey.</div>'}function renderSummary(q){const qa=answers.filter(a=>a.question_id===q.id);if(['single_choice','multiple_choice','dropdown'].includes(q.question_type)){const counts={};qa.forEach(a=>{if(a.option_id)counts[a.option_id]=(counts[a.option_id]||0)+1});const respondentCount=new Set(qa.filter(a=>a.option_id).map(a=>a.response_id)).size;const denominator=respondentCount||1;const note=q.question_type==='multiple_choice'?'Percentages may total more than 100% because respondents can select more than one option.':'Percentages are based on respondents who answered this question.';const rows=options.filter(o=>o.question_id===q.id).sort((a,b)=>a.position-b.position).map(o=>{const c=counts[o.id]||0,p=Math.round(c/denominator*100);return `<div class="barRow"><span>${esc(o.label)}</span><div class="barTrack"><div class="barFill" style="width:${Math.min(p,100)}%"></div></div><strong>${c} · ${p}%</strong></div>`}).join('');return rows?rows+`<p class="small">${respondentCount} respondent${respondentCount===1?'':'s'} answered. ${note}</p>`:'<p class="empty">No options or responses yet.</p>'}if(q.question_type==='rating'){const nums=qa.map(a=>Number(a.answer_number)).filter(Number.isFinite);if(!nums.length)return'<p class="empty">No ratings yet.</p>';const avg=(nums.reduce((a,b)=>a+b,0)/nums.length).toFixed(1);return `<p><strong style="font-size:34px;color:#1477e6">${avg}</strong> average from ${nums.length} response${nums.length===1?'':'s'}</p>`}if(q.question_type==='yes_no'){const yes=qa.filter(a=>a.answer_boolean===true).length,no=qa.filter(a=>a.answer_boolean===false).length,total=yes+no||1;return `<div class="barRow"><span>Yes</span><div class="barTrack"><div class="barFill" style="width:${Math.round(yes/total*100)}%"></div></div><strong>${yes} · ${Math.round(yes/total*100)}%</strong></div><div class="barRow"><span>No</span><div class="barTrack"><div class="barFill" style="width:${Math.round(no/total*100)}%"></div></div><strong>${no} · ${Math.round(no/total*100)}%</strong></div>`}const texts=qa.map(a=>a.answer_text).filter(Boolean);return texts.length?texts.map(t=>`<div class="textAnswer">${esc(t)}</div>`).join(''):'<p class="empty">No written responses yet.</p>'}function exportCsv(){const survey=surveys.find(s=>s.id===Number(document.getElementById('surveySelect').value));const rows=[['Survey','Question','Question Type','Response ID','Submitted At','Answer']];responses.forEach(r=>questions.forEach(q=>{const qa=answers.filter(a=>a.response_id===r.id&&a.question_id===q.id);if(!qa.length)rows.push([survey?.title||'',q.prompt,q.question_type,r.id,r.submitted_at,'']);else qa.forEach(a=>{let value=a.answer_text??a.answer_number??(a.answer_boolean===true?'Yes':a.answer_boolean===false?'No':'');if(a.option_id)value=options.find(o=>o.id===a.option_id)?.label||'';rows.push([survey?.title||'',q.prompt,q.question_type,r.id,r.submitted_at,value])})}));const csv=rows.map(row=>row.map(v=>'"'+String(v??'').replace(/"/g,'""')+'"').join(',')).join('\n');const blob=new Blob([csv],{type:'text/csv;charset=utf-8'}),url=URL.createObjectURL(blob),a=document.createElement('a');a.href=url;a.download=(survey?.title||'survey-results').toLowerCase().replace(/[^a-z0-9]+/g,'-')+'.csv';a.click();URL.revokeObjectURL(url)}document.getElementById('surveySelect').onchange=loadReport;document.getElementById('refreshBtn').onclick=loadReport;document.getElementById('exportBtn').onclick=exportCsv;</script></body></html>
