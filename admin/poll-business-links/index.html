<!doctype html><html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Poll Business Links | TCI Top 10 Admin</title><link rel="stylesheet" href="/styles.css"><link rel="stylesheet" href="/admin/admin.css"><script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script><script src="/app.js" defer></script><style>:root{--ink:#0b2748;--muted:#6b7e91;--line:#e2e9f1;--blue:#1477e6}.wrap{max-width:1040px;margin:auto;padding:20px 16px 90px}.intro{display:flex;justify-content:space-between;align-items:end;gap:18px;margin:8px 0 18px}.intro h1{margin:0 0 6px;font-size:32px;color:var(--ink)}.intro p{margin:0;color:var(--muted);max-width:690px;line-height:1.45}.toolbar{display:grid;grid-template-columns:1fr auto;gap:10px;margin:0 0 12px;background:#fff;border:1px solid var(--line);border-radius:17px;padding:12px}.toolbar select,.linkRow select{min-height:46px;border:1px solid #d7e1eb;border-radius:12px;padding:10px 12px;background:#fff;font:inherit}.statusBar{padding:10px 12px;border-radius:12px;background:#f5f8fc;color:var(--muted);font-size:13px;margin-bottom:12px}.linkRow{display:grid;grid-template-columns:minmax(220px,1fr) minmax(260px,1fr) auto;gap:12px;align-items:center;background:#fff;border:1px solid var(--line);border-radius:16px;padding:15px;margin:10px 0}.optionName{font-size:16px;color:var(--ink)}.linked{font-size:12px;font-weight:850;color:#15834d;margin-top:3px}.unlinked{font-size:12px;color:var(--muted);margin-top:3px}.save{min-height:46px}.empty{background:#fff;border:1px solid var(--line);border-radius:16px;padding:24px;text-align:center;color:var(--muted)}@media(max-width:700px){.wrap{padding:14px 10px 82px}.intro{display:block}.intro h1{font-size:27px}.intro p{font-size:13px}.toolbar,.linkRow{grid-template-columns:1fr}.toolbar{padding:10px}.linkRow{padding:13px}.save{width:100%}.header .nav{display:none}}</style></head><body class="adminPage"><header class="header"><a class="brand" href="/"><div class="crown">♛</div><div><strong>TCI TOP 10</strong><span>Poll Business Links</span></div></a><nav class="nav"><a href="/admin">Dashboard</a><a href="/admin/rankings">Rankings</a><a href="/admin/businesses">Businesses</a><a href="/admin/vote-integrity">Integrity</a></nav><div class="actions" data-member-actions></div></header><main class="wrap"><section class="intro"><div><h1>Connect Poll Options to Businesses</h1><p>Link a poll option to its matching business profile without changing ballots, votes, results, or ranking history.</p></div><a class="btn light" href="/admin/businesses">Manage Businesses</a></section><div class="toolbar"><select id="pollSelect"><option>Loading polls...</option></select><button class="btn light" id="refresh" type="button">Refresh</button></div><p id="status" class="statusBar">Checking administrator access...</p><section id="rows"></section></main><script>const esc=v=>String(v??'').replace(/[&<>'"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;',"'":'&#39;','"':'&quot;'}[c]));let polls=[],listings=[];async function admin(){const{data:{session}}=await window.tciDb.auth.getSession();if(!session){location.href='/auth?mode=login&next='+encodeURIComponent(location.pathname);return false}const{data,error}=await window.tciDb.rpc('is_tci_admin',{check_user:session.user.id});if(error)throw error;return !!data}async function init(){try{if(!await admin()){document.getElementById('status').textContent='Administrator access is required.';return}const[p,l]=await Promise.all([window.tciDb.from('polls').select('id,title').order('title'),window.tciDb.rpc('get_admin_businesses')]);if(p.error)throw p.error;if(l.error)throw l.error;polls=p.data||[];listings=l.data||[];document.getElementById('pollSelect').innerHTML=polls.length?polls.map(x=>`<option value="${x.id}">${esc(x.title)}</option>`).join(''):'<option value="">No polls available</option>';document.getElementById('pollSelect').onchange=load;document.getElementById('refresh').onclick=load;await load()}catch(error){document.getElementById('status').textContent=error.message||'Unable to load business links.'}}async function load(){const pollId=Number(document.getElementById('pollSelect').value);if(!pollId){document.getElementById('rows').innerHTML='<div class="empty">No poll selected.</div>';return}const{data,error}=await window.tciDb.from('poll_options').select('id,label,status,listing_id').eq('poll_id',pollId).order('label');if(error){document.getElementById('status').textContent=error.message;return}document.getElementById('status').textContent=`${data.length} poll option${data.length===1?'':'s'} · linking preserves all existing votes and ranking history.`;document.getElementById('rows').innerHTML=data.length?data.map(o=>`<article class="linkRow" data-id="${o.id}"><div><strong class="optionName">${esc(o.label)}</strong><div class="${o.listing_id?'linked':'unlinked'}">${o.listing_id?'✓ Connected to a business profile':'Not connected yet'}</div></div><select data-listing aria-label="Business profile for ${esc(o.label)}"><option value="">Not linked</option>${listings.map(l=>`<option value="${l.id}" ${l.id===o.listing_id?'selected':''}>${esc(l.name)}${l.is_verified?' ✓':''}${l.status!=='published'?` (${esc(l.status)})`:''}</option>`).join('')}</select><button class="btn primary save" type="button" data-save>Save Link</button></article>`).join(''):'<div class="empty">This poll has no options to link.</div>';document.querySelectorAll('[data-save]').forEach(b=>b.onclick=()=>save(b.closest('.linkRow')))}async function save(row){const button=row.querySelector('[data-save]'),value=Number(row.querySelector('[data-listing]').value)||null;button.disabled=true;button.textContent='Saving...';const{error}=await window.tciDb.rpc('link_poll_option_listing',{target_option_id:Number(row.dataset.id),target_listing_id:value});button.disabled=false;button.textContent='Save Link';if(error){alert(error.message);return}document.getElementById('status').textContent=value?'Business link saved successfully.':'Business link removed successfully.';await load()}window.addEventListener('DOMContentLoaded',init);</script></body></html>
