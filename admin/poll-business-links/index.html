<!doctype html><html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Poll Business Links | TCI Top 10 Admin</title><link rel="stylesheet" href="/styles.css"><link rel="stylesheet" href="/admin/admin.css"><script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script><script src="/app.js" defer></script><style>.wrap{max-width:1080px;margin:auto;padding:24px 16px 90px}.hero{background:linear-gradient(135deg,#071b34,#1477e6);color:#fff;border-radius:24px;padding:26px}.toolbar{display:grid;grid-template-columns:1fr auto;gap:10px;margin:18px 0}.toolbar select,.linkRow select{min-height:46px;border:1px solid #dce5ef;border-radius:12px;padding:10px;background:#fff}.linkRow{display:grid;grid-template-columns:1fr 1fr auto;gap:12px;align-items:center;background:#fff;border:1px solid #e6edf5;border-radius:17px;padding:15px;margin:10px 0}.linked{font-size:12px;font-weight:850;color:#15834d}.unlinked{font-size:12px;color:#62748a}@media(max-width:700px){.toolbar,.linkRow{grid-template-columns:1fr}.wrap{padding:14px 10px 82px}}</style></head><body class="adminPage"><header class="header"><a class="brand" href="/"><div class="crown">♛</div><div><strong>TCI TOP 10</strong><span>Poll Business Links</span></div></a><nav class="nav"><a href="/admin">Dashboard</a><a href="/admin/rankings">Rankings</a><a href="/admin/vote-integrity">Integrity</a></nav><div class="actions" data-member-actions></div></header><main class="wrap"><section class="hero"><span class="pill">VERSION 3</span><h1>Connect Poll Options to Business Profiles</h1><p>Link an existing poll option to a business profile without changing the option, ballots, votes or ranking history.</p></section><div class="toolbar"><select id="pollSelect"></select><button class="btn light" id="refresh" type="button">Refresh</button></div><p id="status" class="small">Checking administrator access...</p><section id="rows"></section></main><script>const esc=v=>String(v??'').replace(/[&<>'"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;',"'":'&#39;','"':'&quot;'}[c]));let polls=[],listings=[];async function admin(){const{data:{session}}=await window.tciDb.auth.getSession();if(!session){location.href='/auth?mode=login&next='+encodeURIComponent(location.pathname);return false}const{data}=await window.tciDb.rpc('is_tci_admin',{target_user_id:session.user.id});return !!data}async function init(){if(!await admin()){document.getElementById('status').textContent='Administrator access is required.';return}const[p,l]=await Promise.all([window.tciDb.from('polls').select('id,title').order('title'),window.tciDb.from('listings').select('id,name,slug,status,is_verified').order('name')]);polls=p.data||[];listings=l.data||[];document.getElementById('pollSelect').innerHTML=polls.map(x=>`<option value="${x.id}">${esc(x.title)}</option>`).join('');document.getElementById('pollSelect').onchange=load;document.getElementById('refresh').onclick=load;await load()}async function load(){const pollId=Number(document.getElementById('pollSelect').value);if(!pollId){document.getElementById('rows').innerHTML='';return}const{data,error}=await window.tciDb.from('poll_options').select('id,label,status,listing_id').eq('poll_id',pollId).order('label');if(error){document.getElementById('status').textContent=error.message;return}document.getElementById('status').textContent=`${data.length} poll option${data.length===1?'':'s'}. Linking does not alter existing votes.`;document.getElementById('rows').innerHTML=data.map(o=>`<article class="linkRow" data-id="${o.id}"><div><strong>${esc(o.label)}</strong><div class="${o.listing_id?'linked':'unlinked'}">${o.listing_id?'Connected to business profile':'No business profile connected'}</div></div><select data-listing><option value="">Not linked</option>${listings.map(l=>`<option value="${l.id}" ${l.id===o.listing_id?'selected':''}>${esc(l.name)}${l.is_verified?' ✓':''}${l.status!=='published'?` (${esc(l.status)})`:''}</option>`).join('')}</select><button class="btn primary" type="button" data-save>Save Link</button></article>`).join('')||'<p class="small">No options found.</p>';document.querySelectorAll('[data-save]').forEach(b=>b.onclick=()=>save(b.closest('.linkRow')))}async function save(row){const button=row.querySelector('[data-save]'),value=Number(row.querySelector('[data-listing]').value)||null;button.disabled=true;button.textContent='Saving...';const{error}=await window.tciDb.rpc('link_poll_option_listing',{target_option_id:Number(row.dataset.id),target_listing_id:value});button.disabled=false;button.textContent='Save Link';if(error){alert(error.message);return}await load()}window.addEventListener('DOMContentLoaded',init);</script></body></html>
