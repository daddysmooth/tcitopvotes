<!doctype html><html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Businesses | TCI Top 10 Admin</title><link rel="stylesheet" href="/styles.css"><link rel="stylesheet" href="/admin/admin.css"><script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script><script src="/app.js" defer></script><style>.wrap{max-width:1160px;margin:auto;padding:24px 16px 90px}.hero{background:linear-gradient(135deg,#071b34,#1477e6);color:#fff;border-radius:24px;padding:26px}.toolbar{display:grid;grid-template-columns:1fr auto;gap:10px;margin:18px 0}.toolbar input{min-height:46px;border:1px solid #dce5ef;border-radius:12px;padding:10px 13px}.stats{display:grid;grid-template-columns:repeat(4,1fr);gap:10px;margin:16px 0}.stat{background:#fff;border:1px solid #e6edf5;border-radius:16px;padding:15px}.stat strong{display:block;font-size:27px;color:#1477e6}.cards{display:grid;gap:12px}.card{background:#fff;border:1px solid #e6edf5;border-radius:18px;padding:17px}.head{display:flex;justify-content:space-between;gap:12px}.badges{display:flex;gap:6px;flex-wrap:wrap}.badge{padding:4px 8px;border-radius:999px;background:#eef4fa;font-size:11px;font-weight:900;text-transform:uppercase}.published{background:#e8f7ef;color:#15834d}.pending{background:#fff4db;color:#8a5800}.archived,.rejected{background:#fdecec;color:#b42318}.meta{display:flex;gap:12px;flex-wrap:wrap;margin:10px 0}.buttons{display:flex;gap:7px;flex-wrap:wrap}@media(max-width:720px){.wrap{padding:14px 10px 82px}.stats{grid-template-columns:1fr 1fr}.toolbar{grid-template-columns:1fr}.head{display:grid}.buttons .btn{flex:1}}</style></head><body class="adminPage"><header class="header"><a class="brand" href="/"><div class="crown">♛</div><div><strong>TCI TOP 10</strong><span>Businesses</span></div></a><nav class="nav"><a href="/admin">Dashboard</a><a href="/admin/businesses">Businesses</a><a href="/admin/poll-business-links">Poll Links</a></nav><div class="actions" data-member-actions></div></header><main class="wrap"><section class="hero"><span class="pill">VERSION 3</span><h1>Business Management</h1><p>Create and manage TCI business profiles, publication status, reviews, claims and poll connections.</p></section><div class="stats"><article class="stat"><strong id="total">0</strong><span>Total</span></article><article class="stat"><strong id="published">0</strong><span>Published</span></article><article class="stat"><strong id="pending">0</strong><span>Pending</span></article><article class="stat"><strong id="verified">0</strong><span>Verified</span></article></div><div class="toolbar"><input id="search" placeholder="Search businesses, categories or locations..."><a class="btn primary" href="/admin/businesses/new">+ Add Business</a></div><p id="status" class="small">Checking administrator access...</p><section id="cards" class="cards"></section></main><script>const esc=v=>String(v??'').replace(/[&<>'"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;',"'":'&#39;','"':'&quot;'}[c]));let rows=[];async function admin(){const{data:{session}}=await window.tciDb.auth.getSession();if(!session){location.href='/auth?mode=login&next='+encodeURIComponent(location.pathname);return false}const{data}=await window.tciDb.rpc('is_tci_admin',{target_user_id:session.user.id});return !!data}function render(){const q=document.getElementById('search').value.trim().toLowerCase(),filtered=rows.filter(x=>!q||[x.name,x.category_name,x.location_name].some(v=>String(v||'').toLowerCase().includes(q)));document.getElementById('total').textContent=rows.length;document.getElementById('published').textContent=rows.filter(x=>x.status==='published').length;document.getElementById('pending').textContent=rows.filter(x=>x.status==='pending').length;document.getElementById('verified').textContent=rows.filter(x=>x.is_verified).length;document.getElementById('status').textContent=`${filtered.length} business${filtered.length===1?'':'es'} shown.`;document.getElementById('cards').innerHTML=filtered.length?filtered.map(x=>`<article class="card"><div class="head"><div><div class="badges"><span class="badge ${esc(x.status)}">${esc(x.status)}</span>${x.is_verified?'<span class="badge published">✓ Verified</span>':''}</div><h2>${esc(x.name)}</h2><div class="small">${esc(x.category_name)}${x.location_name?' · '+esc(x.location_name):''}</div></div><div class="small">${x.review_count} reviews · ${x.claim_count} claims · ${x.poll_link_count} poll links</div></div><div class="meta"><span>${esc(x.phone||'No phone')}</span><span>${esc(x.website_url||'No website')}</span></div><div class="buttons"><a class="btn light" href="/admin/businesses/new?id=${x.id}">Edit</a>${x.status==='published'?`<a class="btn light" href="/listings/${encodeURIComponent(x.slug)}" target="_blank">View Profile</a>`:''}<a class="btn light" href="/admin/poll-business-links">Poll Links</a>${x.status!=='published'?`<button class="btn primary" onclick="setStatus(${x.id},'published')">Publish</button>`:`<button class="btn light" onclick="setStatus(${x.id},'archived')">Archive</button>`}</div></article>`).join(''):'<div class="card" style="text-align:center"><h2>No businesses found</h2><a class="btn primary" href="/admin/businesses/new">Add the First Business</a></div>'}async function load(){const{data,error}=await window.tciDb.rpc('get_admin_businesses');if(error){document.getElementById('status').textContent=error.message;return}rows=data||[];render()}async function setStatus(id,status){if(!confirm(status==='published'?'Publish this business profile?':'Archive this business profile?'))return;const{error}=await window.tciDb.rpc('set_business_status',{target_listing_id:id,target_status:status});if(error){alert(error.message);return}load()}document.getElementById('search').oninput=render;window.addEventListener('DOMContentLoaded',async()=>{if(await admin())load();else document.getElementById('status').textContent='Administrator access is required.'});</script></body></html>
