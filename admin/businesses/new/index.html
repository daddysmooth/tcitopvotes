<!doctype html><html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Add Business | TCI Top 10 Admin</title><link rel="stylesheet" href="/styles.css"><link rel="stylesheet" href="/admin/admin.css"><script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script><script src="/app.js" defer></script><style>.wrap{max-width:900px;margin:auto;padding:24px 16px 90px}.hero{background:linear-gradient(135deg,#071b34,#1477e6);color:#fff;border-radius:24px;padding:26px}.form{background:#fff;border:1px solid #e6edf5;border-radius:20px;padding:20px;margin-top:18px}.grid{display:grid;grid-template-columns:1fr 1fr;gap:14px}.field{display:grid;gap:6px}.field.full{grid-column:1/-1}.field label{font-weight:850}.field input,.field textarea,.field select{width:100%;padding:12px;border:1px solid #dce5ef;border-radius:12px;font:inherit}.hours{display:grid;grid-template-columns:repeat(2,1fr);gap:10px}.actionsBar{display:flex;gap:9px;justify-content:flex-end;margin-top:18px}@media(max-width:700px){.wrap{padding:14px 10px 82px}.grid,.hours{grid-template-columns:1fr}.field.full{grid-column:auto}.actionsBar{display:grid}}</style></head><body class="adminPage"><header class="header"><a class="brand" href="/"><div class="crown">♛</div><div><strong>TCI TOP 10</strong><span id="headerMode">Add Business</span></div></a><nav class="nav"><a href="/admin">Dashboard</a><a href="/admin/businesses">Businesses</a><a href="/admin/poll-business-links">Poll Links</a></nav><div class="actions" data-member-actions></div></header><main class="wrap"><section class="hero"><span class="pill">VERSION 3</span><h1 id="pageTitle">Add a Business</h1><p>Create a business profile that can later be connected directly to poll options, rankings and reviews.</p></section><form id="form" class="form"><div class="grid"><div class="field"><label>Business Name *</label><input id="name" maxlength="160" required></div><div class="field"><label>Category *</label><select id="category" required><option value="">Loading categories...</option></select></div><div class="field"><label>Island / Location</label><select id="location"><option value="">Loading islands...</option></select></div><div class="field"><label>Price Level</label><select id="price"><option value="">Not specified</option><option value="1">$</option><option value="2">$$</option><option value="3">$$$</option><option value="4">$$$$</option></select></div><div class="field full"><label>Description</label><textarea id="description" rows="5" maxlength="2500" placeholder="Describe the business for visitors and residents."></textarea></div><div class="field"><label>Phone</label><input id="phone" type="tel"></div><div class="field"><label>Email</label><input id="email" type="email"></div><div class="field"><label>Website</label><input id="website" type="url" placeholder="https://"></div><div class="field"><label>Address</label><input id="address"></div><div class="field full"><label>Opening Hours</label><div class="hours" id="hours"></div></div><div class="field full" id="statusField"><label>Initial Publication Status</label><select id="publication"><option value="pending">Pending — review before publishing</option><option value="published">Published — visible immediately</option></select><p class="small">Pending is recommended while you complete the profile and media.</p></div></div><p id="status" class="small"></p><div class="actionsBar"><a class="btn light" href="/admin/businesses">Cancel</a><button id="save" class="btn primary" type="submit">Save Business</button></div></form></main><script>const esc=v=>String(v??'').replace(/[&<>'"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;',"'":'&#39;','"':'&quot;'}[c]));const params=new URLSearchParams(location.search),editId=Number(params.get('id'))||null,days=['Monday','Tuesday','Wednesday','Thursday','Friday','Saturday','Sunday'];let businesses=[];async function admin(){const{data:{session}}=await window.tciDb.auth.getSession();if(!session){location.href='/auth?mode=login&next='+encodeURIComponent(location.pathname+location.search);return false}const{data}=await window.tciDb.rpc('is_tci_admin',{target_user_id:session.user.id});return !!data}function hoursObject(){const out={};days.forEach(day=>{const v=document.querySelector(`[data-day="${day}"]`).value.trim();if(v)out[day]=v});return out}async function init(){if(!await admin()){document.getElementById('status').textContent='Administrator access is required.';document.getElementById('save').disabled=true;return}document.getElementById('hours').innerHTML=days.map(day=>`<div class="field"><label>${day}</label><input data-day="${day}" placeholder="e.g. 8:00 AM – 10:00 PM"></div>`).join('');const[options,b]=await Promise.all([window.tciDb.rpc('get_admin_business_form_options'),editId?window.tciDb.rpc('get_admin_businesses'):Promise.resolve({data:[]})]);if(options.error){document.getElementById('status').textContent='Unable to load categories and islands: '+options.error.message;document.getElementById('save').disabled=true;return}const categories=options.data?.categories||[],locations=options.data?.locations||[];document.getElementById('category').innerHTML='<option value="">Select a category</option>'+categories.map(x=>`<option value="${x.id}">${esc(x.name)}</option>`).join('');document.getElementById('location').innerHTML='<option value="">Select an island / location</option>'+locations.map(x=>`<option value="${x.id}">${esc(x.name)}</option>`).join('');if(editId){businesses=b.data||[];const x=businesses.find(r=>r.id===editId);if(!x){document.getElementById('status').textContent='Business not found.';return}document.getElementById('pageTitle').textContent='Edit Business';document.getElementById('headerMode').textContent='Edit Business';document.getElementById('save').textContent='Save Changes';document.getElementById('statusField').hidden=true;document.getElementById('name').value=x.name||'';document.getElementById('category').value=x.category_id;document.getElementById('location').value=x.location_id||'';document.getElementById('price').value=x.price_level||'';document.getElementById('description').value=x.description||'';document.getElementById('phone').value=x.phone||'';document.getElementById('email').value=x.email||'';document.getElementById('website').value=x.website_url||'';document.getElementById('address').value=x.address||'';Object.entries(x.opening_hours||{}).forEach(([day,value])=>{const el=document.querySelector(`[data-day="${day}"]`);if(el)el.value=value})}}document.getElementById('form').onsubmit=async e=>{e.preventDefault();const button=document.getElementById('save'),status=document.getElementById('status');button.disabled=true;button.textContent='Saving...';const common={target_name:document.getElementById('name').value.trim(),target_category_id:Number(document.getElementById('category').value),target_location_id:Number(document.getElementById('location').value)||null,target_description:document.getElementById('description').value.trim()||null,target_website_url:document.getElementById('website').value.trim()||null,target_phone:document.getElementById('phone').value.trim()||null,target_email:document.getElementById('email').value.trim()||null,target_address:document.getElementById('address').value.trim()||null,target_price_level:Number(document.getElementById('price').value)||null,target_opening_hours:hoursObject()};const result=editId?await window.tciDb.rpc('update_admin_business',{target_listing_id:editId,...common}):await window.tciDb.rpc('create_admin_business',{...common,target_status:document.getElementById('publication').value});if(result.error){status.textContent=result.error.message;button.disabled=false;button.textContent=editId?'Save Changes':'Save Business';return}status.textContent=editId?'Business updated successfully.':'Business created successfully.';setTimeout(()=>location.href='/admin/businesses',500)};window.addEventListener('DOMContentLoaded',init);</script></body></htm
