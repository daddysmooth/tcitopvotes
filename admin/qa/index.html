<!doctype html><html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>QA Dashboard | TCI Top 10</title><link rel="stylesheet" href="/styles.css"><link rel="stylesheet" href="/admin/admin.css"><script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script><script src="/app.js" defer></script><style>.wrap{max-width:1120px;margin:auto;padding:34px 24px 90px}.qaGrid{display:grid;grid-template-columns:repeat(2,1fr);gap:16px}.qaCard{background:#fff;border:1px solid #e6edf5;border-radius:18px;padding:18px}.check{display:flex;justify-content:space-between;gap:14px;padding:11px 0;border-bottom:1px solid #edf2f7}.pass{color:#15834d;font-weight:900}.warn{color:#a05a00;font-weight:900}.fail{color:#b42318;font-weight:900}.manual{margin-top:22px;background:#fff;border:1px solid #e6edf5;border-radius:18px;padding:20px}.manual label{display:block;padding:8px 0}@media(max-width:760px){.qaGrid{grid-template-columns:1fr}}</style></head><body><main class="adminPage"><header class="header"><a class="brand" href="/"><div class="crown">♛</div><div><strong>TCI TOP 10</strong><span>Quality Assurance</span></div></a><div class="actions" data-member-actions></div></header><section class="wrap"><span class="pill">LIVE DIAGNOSTICS</span><h1>Poll and Survey QA Dashboard</h1><p id="status" class="small">Checking administrator access...</p><div id="content" hidden><div id="qaGrid" class="qaGrid"></div><section class="manual"><h2>Manual Production Checks</h2><p class="small">These checks require administrator or participant interaction and should be completed before public launch.</p><label><input type="checkbox"> Register a new member and confirm email/login behaviour</label><label><input type="checkbox"> Submit one valid poll ballot and confirm duplicate protection</label><label><input type="checkbox"> Submit a member survey and confirm Survey History</label><label><input type="checkbox"> Submit an anonymous survey and confirm device duplicate protection</label><label><input type="checkbox"> Verify survey CSV export against visible results</label><label><input type="checkbox"> Delete a test survey response and confirm totals update</label><label><input type="checkbox"> Test administrator pages on mobile and desktop</label><label><input type="checkbox"> Test unauthorized access to administrator routes</label></section></div></section></main><script>const db=()=>window.tciDb;window.addEventListener('DOMContentLoaded',init);async function init(){const session=(await db().auth.getSession()).data.session;if(!session){location.href='/auth?mode=login&next=%2Fadmin%2Fqa';return}const roles=await db().from('user_roles').select('role').eq('user_id',session.user.id);if(!(roles.data||[]).some(r=>['administrator','super_administrator'].includes(r.role))){document.getElementById('status').textContent='Administrator access is required.';return}document.getElementById('content').hidden=false;await runChecks()}async function runChecks(){const checks=[];const add=(group,name,state,detail)=>checks.push({group,name,state,detail});const [polls,options,ballots,selections,surveys,questions,responses,periods,results]=await Promise.all([db().from('polls').select('id,status'),db().from('poll_options').select('id,poll_id,status'),db().from('ballots').select('id,poll_id,integrity_status'),db().from('ballot_selections').select('ballot_id,poll_option_id'),db().from('surveys').select('id,status'),db().from('survey_questions').select('id,survey_id,is_required'),db().from('survey_responses').select('id,survey_id'),db().from('ranking_periods').select('id,status'),db().from('ranking_results').select('id,ranking_period_id,position')]);add('Polls','Poll data access',polls.error?'fail':'pass',polls.error?.message||`${polls.data?.length||0} polls found`);add('Polls','Active poll options',options.error?'fail':(options.data||[]).some(x=>x.status==='active')?'pass':'warn',options.error?.message||`${(options.data||[]).filter(x=>x.status==='active').length} active options`);add('Polls','Valid ballots',ballots.error?'fail':(ballots.data||[]).some(x=>x.integrity_status==='valid')?'pass':'warn',ballots.error?.message||`${(ballots.data||[]).filter(x=>x.integrity_status==='valid').length} valid ballots`);add('Polls','Ballot selections',selections.error?'fail':(selections.data||[]).length?'pass':'warn',selections.error?.message||`${selections.data?.length||0} selections`);add('Surveys','Survey data access',surveys.error?'fail':'pass',surveys.error?.message||`${surveys.data?.length||0} surveys found`);add('Surveys','Survey questions',questions.error?'fail':(questions.data||[]).length?'pass':'warn',questions.error?.message||`${questions.data?.length||0} questions`);add('Surveys','Survey responses',responses.error?'fail':(responses.data||[]).length?'pass':'warn',responses.error?.message||`${responses.data?.length||0} responses`);add('Rankings','Ranking periods',periods.error?'fail':(periods.data||[]).length?'pass':'warn',periods.error?.message||`${periods.data?.length||0} periods`);add('Rankings','Published Top 10 results',results.error?'fail':(results.data||[]).length?'pass':'warn',results.error?.message||`${results.data?.length||0} ranking rows`);const groups=[...new Set(checks.map(x=>x.group))];document.getElementById('qaGrid').innerHTML=groups.map(group=>`<section class="qaCard"><h2>${group}</h2>${checks.filter(x=>x.group===group).map(x=>`<div class="check"><div><strong>${x.name}</strong><div class="small">${x.detail}</div></div><span class="${x.state}">${x.state.toUpperCase()}</span></div>`).join('')}</section>`).join('');document.getElementById('status').textContent='Automated diagnostics completed.'}</script></body></html>
