<!doctype html><html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Ratings & Reviews | TCI Top 10 Admin</title><link rel="stylesheet" href="/styles.css"><link rel="stylesheet" href="/admin/admin.css"><script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script><script src="/app.js" defer></script><style>.wrap{max-width:1000px;margin:auto;padding:22px 14px 90px}.hero{background:linear-gradient(135deg,#082b55,#1477e6);color:#fff;border-radius:22px;padding:22px 24px}.hero h1{font-size:34px;line-height:1.05;margin:12px 0 8px}.hero p{max-width:680px;margin:0;line-height:1.45}.toolbar{display:flex;gap:9px;margin:16px 0}.toolbar select{min-height:45px;padding:9px;border:1px solid #dce5ef;border-radius:12px}.queue{display:grid;gap:11px}.review{background:#fff;border:1px solid #e1e9f2;border-radius:18px;padding:17px}.top{display:flex;justify-content:space-between;gap:12px}.stars{color:#d99a00;font-weight:900}.body{white-space:pre-wrap;margin:10px 0}.buttons{display:flex;gap:8px;flex-wrap:wrap}.approve{background:#168a55;color:#fff;border:0}.reject{background:#fff0f0;color:#b42318;border:1px solid #ffd4d4}.notice{padding:10px 12px;border-radius:11px;background:#eef8f2;color:#17663f;font-size:13px;font-weight:700;margin:10px 0;display:none}@media(max-width:700px){.wrap{padding:12px 10px 85px}.hero{padding:16px 17px;border-radius:18px}.hero .pill{font-size:10px;padding:5px 9px}.hero h1{font-size:27px;margin:8px 0 5px}.hero p{font-size:13px;line-height:1.35;max-width:440px}.top{display:grid}.buttons .btn{flex:1;min-height:48px}.toolbar{margin:12px 0}.header{min-height:66px;padding:9px 14px}.header .brand .crown{width:42px;height:42px}.header .brand strong{font-size:19px}.header .brand span,.header .nav,.header [data-member-actions]{display:none!important}}</style></head><body class="adminPage"><header class="header"><a class="brand" href="/"><div class="crown">♛</div><div><strong>TCI TOP 10</strong><span>Review Moderation</span></div></a><nav class="nav"><a href="/admin">Dashboard</a><a href="/admin/businesses">Businesses</a><a href="/admin/reviews">Ratings & Reviews</a></nav><div class="actions" data-member-actions></div></header><main class="wrap"><section class="hero"><span class="pill">ADMIN</span><h1>Ratings & Reviews</h1><p>Approve or reject community reviews and business responses.</p></section><div id="notice" class="notice"></div><div class="toolbar"><select id="filter"><option value="pending">Pending Approval</option><option value="published">Published</option><option value="rejected">Rejected</option><option value="all">All Reviews</option></select><button class="btn light" id="refresh">Refresh</button></div><p id="status" class="small">Loading review queue...</p><section id="queue" class="queue"></section></main><script>const esc=v=>String(v??'').replace(/[&<>'"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;',"'":'&#39;','"':'&quot;'}[c]));async function wait(){for(let i=0;i<40;i++){if(window.tciDb)return window.tciDb;await new Promise(r=>setTimeout(r,100))}throw new Error('Database unavailable')}async function load(){try{const db=await wait(),filter=document.getElementById('filter').value;const{data,error}=await db.rpc('get_admin_business_review_queue',{target_status:filter});if(error)throw error;document.getElementById('status').textContent=`${data.length} item${data.length===1?'':'s'} in this view.`;document.getElementById('queue').innerHTML=data.map(x=>`<article class="review"><div class="top"><div><strong>${esc(x.listing_name)}</strong><div class="small">${esc(x.author_name)} · ${x.item_type==='review'?'Community Review':'Business Response'}</div></div><div>${x.rating?`<span class="stars">${'★'.repeat(x.rating)}${'☆'.repeat(5-x.rating)}</span>`:''} <span class="pill">${esc(x.status)}</span></div></div>${x.title?`<h3>${esc(x.title)}</h3>`:''}<div class="body">${esc(x.body)}</div><div class="buttons">${x.status!=='published'?'<button class="btn approve" data-action="published">Approve</button>':''}${x.status!=='rejected'?'<button class="btn reject" data-action="rejected">Reject</button>':''}<a class="btn light" href="/admin/businesses">Business</a></div></article>`).join('')||'<article class="review"><h2>Nothing waiting</h2><p>There are no reviews or responses in this status.</p></article>';document.querySelectorAll('.review').forEach((card,i)=>card.querySelectorAll('[data-action]').forEach(b=>b.onclick=()=>moderate(data[i],b.dataset.action)))}catch(e){document.getElementById('status').textContent=e.message}}async function moderate(item,status){const verb=status==='published'?'Approve':'Reject';if(!confirm(`${verb} this ${item.item_type}?`))return;const db=await wait();let result;if(item.item_type==='review')result=await db.rpc('moderate_business_review',{target_review_id:item.item_id,target_status:status});else result=await db.rpc('moderate_business_review_response',{target_response_id:item.item_id,target_status:status});if(result.error){alert(result.error.message);return}const n=document.getElementById('notice');n.textContent=`${item.item_type==='review'?'Review':'Business response'} ${status==='published'?'approved':'rejected'} successfully.`;n.style.display='block';setTimeout(()=>n.style.display='none',2500);load()}document.getElementById('filter').onchange=load;document.getElementById('refresh').onclick=load;window.addEventListener('DOMContentLoaded',load);</script></body></html>
