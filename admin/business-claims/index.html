<!doctype html><html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Business Claims | TCI Top 10 Admin</title><link rel="stylesheet" href="/styles.css"><link rel="stylesheet" href="/admin/admin.css"><script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script><script src="/app.js" defer></script><style>.wrap{max-width:1000px;margin:auto;padding:14px 12px 90px}.hero{background:linear-gradient(135deg,#082b55,#1477e6);color:#fff;border-radius:18px;padding:16px 18px}.hero h1{font-size:28px;margin:6px 0 4px}.hero p{margin:0;font-size:13px}.tabs{display:flex;gap:8px;overflow:auto;margin:13px 0}.tab{border:1px solid #dce5ef;background:#fff;border-radius:999px;padding:9px 13px;font-weight:850;white-space:nowrap}.tab.active{background:#1477e6;color:#fff}.queue{display:grid;gap:11px}.card{background:#fff;border:1px solid #e1e9f2;border-radius:17px;padding:16px}.top{display:flex;justify-content:space-between;gap:10px}.meta{color:#667b90;font-size:12px}.evidence{background:#f6f8fb;border-radius:11px;padding:10px;margin:10px 0;white-space:pre-wrap}.actions{display:flex;gap:8px;flex-wrap:wrap}.approve{background:#168a55;color:#fff;border:0}.reject{background:#fff0f0;color:#b42318;border:1px solid #ffd4d4}.preview{width:100%;max-height:240px;object-fit:cover;border-radius:12px;margin:10px 0}@media(max-width:700px){.header .nav{display:none}.wrap{padding:10px 9px 82px}.hero{padding:14px 15px}.hero h1{font-size:25px}.top{display:grid}.actions .btn{flex:1;min-height:46px}}</style></head><body class="adminPage"><header class="header"><a class="brand" href="/"><div class="crown">♛</div><div><strong>TCI TOP 10</strong><span>Business Moderation</span></div></a><nav class="nav"><a href="/admin">Dashboard</a><a href="/admin/businesses">Businesses</a><a href="/admin/business-claims">Claims & Media</a><a href="/admin/reviews">Reviews</a></nav><div class="actions" data-member-actions></div></header><main class="wrap"><section class="hero"><span class="pill">ADMIN</span><h1>Business Claims & Media</h1><p>Verify business ownership and approve owner-submitted profile images.</p></section><div class="tabs"><button id="claimsTab" class="tab active">Ownership Claims</button><button id="mediaTab" class="tab">Business Media</button></div><p id="status" class="meta">Loading...</p><section id="queue" class="queue"></section></main><script>const esc=v=>String(v??'').replace(/[&<>'"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;',"'":'&#39;','"':'&quot;'}[c]));let db,mode='claims';async function ready(){for(let i=0;i<40;i++){if(window.tciDb)return window.tciDb;await new Promise(r=>setTimeout(r,100))}throw new Error('Database unavailable')}async function load(){try{db=db||await ready();const fn=mode==='claims'?'get_admin_business_claims':'get_admin_business_media_queue';const args=mode==='claims'?{target_status:'pending'}:{target_status:'pending'};const{data,error}=await db.rpc(fn,args);if(error)throw error;document.getElementById('status').textContent=`${data.length} pending ${mode==='claims'?'claim':'media item'}${data.length===1?'':'s'}.`;document.getElementById('queue').innerHTML=data.length?data.map(mode==='claims'?claimCard:mediaCard).join(''):`<article class="card"><strong>Nothing waiting</strong><p class="meta">There are no pending ${mode==='claims'?'ownership claims':'business images'}.</p></article>`}catch(e){document.getElementById('status').textContent=e.message}}function claimCard(x){return `<article class="card"><div class="top"><div><strong>${esc(x.listing_name)}</strong><div class="meta">${esc(x.claimant_name)} · ${esc(x.claimant_email||'No account email')}</div></div><span class="pill">PENDING</span></div><div class="evidence">${esc(JSON.stringify(x.evidence||{},null,2))}</div><div class="actions"><button class="btn approve" onclick="claimAction(${x.claim_id},'approved')">Approve Owner</button><button class="btn reject" onclick="claimAction(${x.claim_id},'rejected')">Reject</button><a class="btn light" href="/listings/${encodeURIComponent(x.listing_slug)}" target="_blank">View Business</a></div></article>`}function mediaCard(x){return `<article class="card"><div class="top"><div><strong>${esc(x.listing_name)}</strong><div class="meta">${esc(x.media_type)} · Submitted ${new Date(x.created_at).toLocaleDateString()}</div></div><span class="pill">PENDING</span></div><img class="preview" src="${esc(x.media_url)}" alt="${esc(x.alt_text||x.listing_name)}"><div class="actions"><button class="btn approve" onclick="mediaAction(${x.media_id},'published')">Approve Image</button><button class="btn reject" onclick="mediaAction(${x.media_id},'rejected')">Reject</button></div></article>`}async function claimAction(id,status){const notes=prompt(status==='approved'?'Optional approval notes:':'Reason for rejection:')||null;if(status==='rejected'&&!notes)return;const{error}=await db.rpc('review_business_claim',{target_claim_id:id,target_status:status,target_notes:notes});if(error){alert(error.message);return}alert(status==='approved'?'Business owner approved. Owner Portal access is now active.':'Claim rejected.');load()}async function mediaAction(id,status){const{error}=await db.rpc('moderate_listing_media',{target_media_id:id,target_status:status});if(error){alert(error.message);return}alert(status==='published'?'Image approved and published.':'Image rejected.');load()}function setMode(x){mode=x;document.getElementById('claimsTab').classList.toggle('active',x==='claims');document.getElementById('mediaTab').classList.toggle('active',x==='media');load()}document.getElementById('claimsTab').onclick=()=>setMode('claims');document.getElementById('mediaTab').onclick=()=>setMode('media');window.addEventListener('DOMContentLoaded',load);</script></body></html>
