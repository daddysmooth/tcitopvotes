<!doctype html><html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Poll Suggestions | TCI Top 10 Admin</title><meta name="robots" content="noindex,nofollow"><link rel="stylesheet" href="/styles.css"><link rel="stylesheet" href="/admin/admin.css"><script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script><script src="/app.js" defer></script><style>.wrap{max-width:1100px;margin:auto;padding:24px 18px 90px}.hero{background:linear-gradient(135deg,#092a55,#1477e6);color:#fff;border-radius:24px;padding:28px}.filters{display:flex;gap:10px;flex-wrap:wrap;margin:18px 0}.filters select{min-height:44px;border:1px solid #dce5ef;border-radius:12px;padding:10px 12px}.queue{display:grid;gap:14px}.suggestion{background:#fff;border:1px solid #e6edf5;border-radius:18px;padding:18px;box-shadow:0 7px 22px rgba(7,27,52,.05)}.suggestionHead{display:flex;justify-content:space-between;gap:12px;align-items:flex-start}.badge{display:inline-flex;padding:4px 8px;border-radius:999px;font-size:11px;font-weight:900;text-transform:uppercase}.badge.pending{background:#fff4db;color:#8a5800}.badge.approved{background:#e8f7ef;color:#15834d}.badge.rejected{background:#fdecec;color:#b42318}.signals{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin:14px 0}.signal{padding:12px;border-radius:12px;background:#f7f9fc;border:1px solid #e6edf5}.optionList{display:flex;flex-wrap:wrap;gap:7px}.optionPill{padding:6px 9px;border-radius:999px;background:#eef4fa;font-size:12px;font-weight:800}.actions{display:grid;grid-template-columns:1fr auto auto;gap:8px;margin-top:14px}.actions input{border:1px solid #dce5ef;border-radius:12px;padding:11px}.empty{background:#fff;border:1px solid #e6edf5;border-radius:18px;padding:26px;text-align:center}@media(max-width:700px){.wrap{padding:14px 10px 82px}.hero{padding:21px 17px;border-radius:20px}.signals{grid-template-columns:1fr}.suggestionHead{display:grid}.actions{grid-template-columns:1fr}.actions .btn{width:100%}}</style></head><body class="adminPage"><header class="header"><a class="brand" href="/"><div class="crown">♛</div><div><strong>TCI TOP 10</strong><span>Administration</span></div></a><nav class="nav"><a href="/admin">Dashboard</a><a href="/admin/poll-suggestions">Suggestions</a><a href="/admin/rankings">Rankings</a><a href="/admin/surveys">Surveys</a></nav><div class="actions" data-member-actions></div></header><main class="wrap"><section class="hero"><span class="pill">ADMIN REVIEW</span><h1>Community Poll Suggestions</h1><p>Review duplicate matches, moderation signals and proposed options before converting a suggestion into a draft poll.</p></section><div class="filters"><select id="statusFilter"><option value="pending">Pending</option><option value="approved">Approved</option><option value="rejected">Rejected</option><option value="all">All</option></select><button id="refresh" class="btn light" type="button">Refresh</button></div><p id="status" class="small">Checking administrator access...</p><section id="queue" class="queue"></section></main><script>const esc=v=>String(v??'').replace(/[&<>'"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;',"'":'&#39;','"':'&quot;'}[c]));let session=null;async function requireAdmin(){const{data:{session:s}}=await window.tciDb.auth.getSession();session=s;if(!session){location.href='/auth?mode=login&next='+encodeURIComponent(location.pathname);return false}const{data,error}=await window.tciDb.rpc('is_tci_admin',{target_user_id:session.user.id});if(error||!data){document.getElementById('status').textContent='Administrator access is required.';return false}return true}function signalHtml(item){const moderation=item.moderation_result||{},duplicates=Array.isArray(item.duplicate_matches)?item.duplicate_matches:[];const risk=moderation.risk||'none',score=Number(moderation.score||0),flags=Array.isArray(moderation.flags)?moderation.flags:[];return `<div class="signals"><div class="signal"><strong>Moderation</strong><div class="small">Risk: ${esc(risk)} · Score ${score}/100</div><div class="small">${flags.length?flags.map(esc).join(', '):'No signals detected'}</div></div><div class="signal"><strong>Possible duplicates</strong>${duplicates.length?duplicates.map(d=>`<div class="small">${esc(d.title)} · ${Math.round(Number(d.similarity||0)*100)}%</div>`).join(''):'<div class="small">No similar polls found.</div>'}</div></div>`}async function loadQueue(){const filter=document.getElementById('statusFilter').value,status=document.getElementById('status'),queue=document.getElementById('queue');status.textContent='Loading suggestions...';let query=window.tciDb.from('poll_suggestions').select('id,title,description,suggested_options,status,moderation_result,duplicate_matches,review_notes,created_at,created_poll_id,categories(name)').order('created_at',{ascending:false});if(filter!=='all')query=query.eq('status',filter);const{data,error}=await query;if(error){status.textContent=error.message;queue.innerHTML='';return}const rows=data||[];status.textContent=`${rows.length} suggestion${rows.length===1?'':'s'} found.`;queue.innerHTML=rows.length?rows.map(item=>`<article class="suggestion" data-id="${item.id}"><div class="suggestionHead"><div><span class="badge ${esc(item.status)}">${esc(item.status)}</span><h2>${esc(item.title)}</h2><div class="small">${esc(item.categories?.name||'Uncategorised')} · Submitted ${new Date(item.created_at).toLocaleString()}</div></div>${item.created_poll_id?`<a class="btn light" href="/admin">Draft Poll #${item.created_poll_id}</a>`:''}</div>${item.description?`<p>${esc(item.description)}</p>`:''}<div class="optionList">${(item.suggested_options||[]).map(option=>`<span class="optionPill">${esc(option)}</span>`).join('')}</div>${signalHtml(item)}${item.review_notes?`<p class="small"><strong>Review note:</strong> ${esc(item.review_notes)}</p>`:''}${item.status==='pending'?`<div class="actions"><input data-notes placeholder="Optional review note"><button class="btn primary" data-action="approved">Approve as Draft</button><button class="btn light" data-action="rejected">Reject</button></div>`:''}</article>`).join(''):'<div class="empty"><h2>No suggestions in this view</h2><p class="small">New community submissions will appear here for review.</p></div>';queue.querySelectorAll('[data-action]').forEach(button=>button.onclick=()=>reviewSuggestion(button.closest('.suggestion'),button.dataset.action))}async function reviewSuggestion(card,decision){const id=Number(card.dataset.id),notes=card.querySelector('[data-notes]')?.value.trim()||null;if(!confirm(decision==='approved'?'Approve this suggestion and create a draft poll?':'Reject this suggestion?'))return;const buttons=card.querySelectorAll('button');buttons.forEach(b=>b.disabled=true);const{data,error}=await window.tciDb.rpc('review_poll_suggestion',{target_suggestion_id:id,target_decision:decision,target_notes:notes});if(error){alert(error.message);buttons.forEach(b=>b.disabled=false);return}alert(decision==='approved'?`Suggestion approved. Draft poll #${data} was created.`:'Suggestion rejected.');loadQueue()}document.getElementById('statusFilter').onchange=loadQueue;document.getElementById('refresh').onclick=loadQueue;window.addEventListener('DOMContentLoaded',async()=>{if(await requireAdmin())loadQueue()});</script></body></html>
