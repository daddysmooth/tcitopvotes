<!doctype html><html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>My Survey History | TCI Top 10</title><link rel="stylesheet" href="/styles.css"><script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script><script src="/app.js" defer></script><style>.historyWrap{max-width:1050px;margin:auto;padding:36px 22px 90px}.historyHead{display:flex;justify-content:space-between;gap:16px;align-items:center;margin-bottom:24px}.stats{display:grid;grid-template-columns:repeat(3,1fr);gap:14px;margin-bottom:22px}.stats article,.historyCard{background:#fff;border:1px solid #e6edf5;border-radius:18px;padding:20px}.stats strong{display:block;font-size:30px;color:#1477e6}.historyGrid{display:grid;gap:14px}.historyCard{display:flex;justify-content:space-between;gap:18px;align-items:center}.statusDone{font-size:12px;font-weight:900;color:#15834d}.statusOpen{font-size:12px;font-weight:900;color:#1477e6}.small{color:#62748a}@media(max-width:720px){.historyHead,.historyCard{align-items:flex-start;flex-direction:column}.stats{grid-template-columns:1fr}}</style></head><body><main><header class="header"><a class="brand" href="/"><div class="crown">♛</div><div><strong>TCI TOP 10</strong><span>My Survey History</span></div></a><nav class="nav"><a href="/">Explore</a><a href="/polls">Polls</a><a href="/surveys">Surveys</a><a href="/profile">Profile</a></nav><div class="actions" data-member-actions></div></header><section class="historyWrap"><div class="historyHead"><div><span class="pill">MEMBER ACTIVITY</span><h1>My Survey History</h1><p class="small">See completed surveys and surveys still available for your participation.</p></div><a class="btn primary" href="/surveys">Browse Surveys</a></div><p id="status" class="small">Loading your survey activity...</p><section class="stats"><article><strong id="completedCount">0</strong><span>Completed</span></article><article><strong id="availableCount">0</strong><span>Available</span></article><article><strong id="latestDate">—</strong><span>Latest response</span></article></section><div id="historyGrid" class="historyGrid"></div></section></main><script>const db=()=>window.tciDb;const esc=v=>String(v??'').replace(/[&<>'"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;',"'":'&#39;','"':'&quot;'}[c]));window.addEventListener('DOMContentLoaded',loadHistory);async function loadHistory(){const session=(await db().auth.getSession()).data.session;if(!session){location.href='/auth?mode=login&next=%2Fprofile%2Fsurveys';return}const [responseRes,surveyRes]=await Promise.all([db().from('survey_responses').select('id,survey_id,submitted_at').eq('user_id',session.user.id).order('submitted_at',{ascending:false}),db().from('surveys').select('id,title,slug,description,status,access_mode,closes_at,created_at').in('status',['published','closed']).order('created_at',{ascending:false})]);if(responseRes.error||surveyRes.error){document.getElementById('status').textContent='Unable to load your survey history.';return}const responses=responseRes.data||[],surveys=surveyRes.data||[],completedIds=new Set(responses.map(r=>r.survey_id));const completed=surveys.filter(s=>completedIds.has(s.id)),available=surveys.filter(s=>!completedIds.has(s.id)&&s.status==='published'&&(!s.closes_at||new Date(s.closes_at)>new Date()));document.getElementById('completedCount').textContent=completed.length;document.getElementById('availableCount').textContent=available.length;document.getElementById('latestDate').textContent=responses[0]?new Date(responses[0].submitted_at).toLocaleDateString():'—';document.getElementById('status').textContent=`${completed.length} completed survey${completed.length===1?'':'s'} and ${available.length} available.`;const items=[...completed.map(s=>({survey:s,response:responses.find(r=>r.survey_id===s.id),done:true})),...available.map(s=>({survey:s,done:false}))];document.getElementById('historyGrid').innerHTML=items.map(item=>`<article class="historyCard"><div><span class="${item.done?'statusDone':'statusOpen'}">${item.done?'COMPLETED':'AVAILABLE'}</span><h2>${esc(item.survey.title)}</h2><p>${esc(item.survey.description||'Community survey')}</p><div class="small">${item.done?'Submitted '+new Date(item.response.submitted_at).toLocaleString():(item.survey.closes_at?'Closes '+new Date(item.survey.closes_at).toLocaleString():'No closing date')}</div></div><a class="btn ${item.done?'light':'primary'}" href="/surveys/${encodeURIComponent(item.survey.slug)}">${item.done?'View Survey':'Start Survey'}</a></article>`).join('')||'<article class="historyCard"><div><strong>No survey activity yet.</strong><p class="small">Open the survey directory to see what is available.</p></div><a class="btn primary" href="/surveys">Browse Surveys</a></article>'}</script></body></html>
