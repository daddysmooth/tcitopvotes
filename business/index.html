<!doctype html><html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Business Owner Portal | TCI Top 10</title><link rel="stylesheet" href="/styles.css"><script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script><script src="/app.js" defer></script><style>.wrap{max-width:980px;margin:auto;padding:18px 12px 90px}.intro{background:linear-gradient(135deg,#092a55,#1477e6);color:#fff;border-radius:20px;padding:20px}.intro h1{margin:5px 0;font-size:32px}.grid{display:grid;grid-template-columns:repeat(2,1fr);gap:12px;margin-top:15px}.card{background:#fff;border:1px solid #e1e9f2;border-radius:18px;padding:18px}.business{grid-column:1/-1}.tabs{display:flex;gap:7px;overflow:auto;margin:12px 0}.tab{white-space:nowrap;border:1px solid #dce5ef;background:#fff;border-radius:999px;padding:9px 12px;font-weight:800}.tab.active{background:#1477e6;color:#fff}.form{display:grid;gap:10px}.form input,.form textarea,.form select{width:100%;padding:12px;border:1px solid #dce5ef;border-radius:12px;font:inherit}.review{padding:13px 0;border-bottom:1px solid #e7edf4}.stars{color:#d99a00}.stats{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}.stats div{background:#f5f8fc;border-radius:12px;padding:13px;text-align:center}.stats strong{display:block;font-size:24px;color:#1477e6}@media(max-width:700px){.wrap{padding:12px 10px 82px}.intro{padding:16px;border-radius:18px}.intro h1{font-size:27px}.grid{grid-template-columns:1fr}.business{grid-column:auto}.stats{grid-template-columns:1fr 1fr}.header .nav{display:none}}</style></head><body><header class="header"><a class="brand" href="/"><div class="crown">♛</div><div><strong>TCI TOP 10</strong><span>Business Owner Portal</span></div></a><nav class="nav"><a href="/businesses">Businesses</a><a href="/">Home</a></nav><div class="actions" data-member-actions></div></header><main class="wrap"><section class="intro"><span class="pill">BUSINESS OWNER</span><h1>Manage your business</h1><p>Edit your verified profile, upload photos, respond to reviews and view performance.</p></section><p id="status" class="small">Loading your businesses...</p><section id="content"></section></main><script>const esc=v=>String(v??'').replace(/[&<>'"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;',"'":'&#39;','"':'&quot;'}[c]));let db,listing;async function ready(){for(let i=0;i<40;i++){if(window.tciDb)return window.tciDb;await new Promise(r=>setTimeout(r,100))}throw new Error('Database unavailable')}async function init(){db=await ready();const{data:{session}}=await db.auth.getSession();if(!session){location.href='/auth?mode=login&next=/business';return}const{data,error}=await db.rpc('get_my_businesses');if(error){document.getElementById('status').textContent=error.message;return}if(!data?.length){document.getElementById('status').textContent='You do not have a verified business profile yet.';document.getElementById('content').innerHTML='<article class="card"><h2>Claim your business</h2><p>Find your business in the public directory and select “Own this business? Claim this profile”. After administrator approval, it will appear here.</p><a class="btn primary" href="/businesses">Find My Business</a></article>';return}listing=data[0];document.getElementById('status').textContent='';render();loadReviews();loadStats()}function render(){document.getElementById('content').innerHTML=`<div class="grid"><article class="card business"><h2>${esc(listing.name)}</h2><p class="small">Verified owner access · ${esc(listing.role)}</p><div class="tabs"><button class="tab active" onclick="show('profile')">Profile</button><button class="tab" onclick="show('media')">Photos & Branding</button><button class="tab" onclick="show('reviews')">Reviews</button><button class="tab" onclick="show('analytics')">Analytics</button><a class="tab" href="/listings/${encodeURIComponent(listing.slug)}">View Public Page</a></div><div id="profile"><form id="editForm" class="form"><textarea id="desc" rows="5" placeholder="Business description">${esc(listing.description||'')}</textarea><input id="phone" value="${esc(listing.phone||'')}" placeholder="Phone"><input id="email" type="email" value="${esc(listing.email||'')}" placeholder="Business email"><input id="website" type="url" value="${esc(listing.website_url||'')}" placeholder="Website"><input id="address" value="${esc(listing.address||'')}" placeholder="Address"><textarea id="hours" rows="5" placeholder='Opening hours JSON'>${esc(JSON.stringify(listing.opening_hours||{},null,2))}</textarea><button class="btn primary">Save Profile</button><p id="editStatus" class="small"></p></form></div><div id="media" hidden><h3>Photos & Branding</h3><p class="small">Upload JPG, PNG or WebP images up to 10 MB. Images are submitted for moderation before appearing publicly.</p><div class="form"><select id="mediaType"><option value="cover">Cover / Header Image</option><option value="logo">Business Logo</option><option value="image">Gallery Photo</option></select><input id="mediaFile" type="file" accept="image/jpeg,image/png,image/webp"><input id="mediaAlt" placeholder="Photo description"><button class="btn primary" type="button" onclick="uploadMedia()">Upload Photo</button><p id="mediaStatus" class="small"></p></div></div><div id="reviews" hidden><h3>Customer Reviews</h3><div id="ownerReviews">Loading...</div></div><div id="analytics" hidden><h3>Business Performance</h3><p class="small">Activity from the last 30 days.</p><div id="stats" class="stats">Loading...</div></div></article></div>`;document.getElementById('editForm').onsubmit=save}function show(id){['profile','media','reviews','analytics'].forEach(x=>document.getElementById(x).hidden=x!==id);document.querySelectorAll('button.tab').forEach(x=>x.classList.toggle('active',x.textContent.toLowerCase().startsWith(id==='media'?'photos':id)))}async function save(e){e.preventDefault();let hours={};try{hours=JSON.parse(document.getElementById('hours').value||'{}')}catch(_){document.getElementById('editStatus').textContent='Opening hours must be valid JSON.';return}const{error}=await db.rpc('update_owned_listing',{target_listing_id:listing.listing_id,target_description:document.getElementById('desc').value.trim()||null,target_website_url:document.getElementById('website').value.trim()||null,target_phone:document.getElementById('phone').value.trim()||null,target_email:document.getElementById('email').value.trim()||null,target_address:document.getElementById('address').value.trim()||null,target_opening_hours:hours});document.getElementById('editStatus').textContent=error?error.message:'Profile updated successfully.'}async function uploadMedia(){const file=document.getElementById('mediaFile').files[0],status=document.getElementById('mediaStatus');if(!file){status.textContent='Choose an image first.';return}if(file.size>10*1024*1024){status.textContent='Image must be 10 MB or smaller.';return}status.textContent='Uploading...';const ext=file.name.split('.').pop().toLowerCase(),path=`${listing.listing_id}/${Date.now()}-${Math.random().toString(36).slice(2)}.${ext}`;const up=await db.storage.from('business-media').upload(path,file,{contentType:file.type});if(up.error){status.textContent=up.error.message;return}const{data:url}=db.storage.from('business-media').getPublicUrl(path);const{error}=await db.rpc('add_listing_media',{target_listing_id:listing.listing_id,target_media_type:document.getElementById('mediaType').value,target_media_url:url.publicUrl,target_alt_text:document.getElementById('mediaAlt').value.trim()||listing.name});status.textContent=error?error.message:'Photo uploaded and submitted successfully.'}async function loadReviews(){const{data,error}=await db.rpc('get_owner_reviews',{target_listing_id:listing.listing_id});const host=document.getElementById('ownerReviews');if(error){host.textContent=error.message;return}host.innerHTML=data?.length?data.map(r=>`<article class="review"><div class="stars">${'★'.repeat(r.rating)}</div><strong>${esc(r.title||'Customer Review')}</strong><p>${esc(r.body)}</p><div class="small">${esc(r.author_name)}${r.service_date?' · Used '+new Date(r.service_date+'T12:00:00').toLocaleDateString():''}</div>${r.response_body?`<p class="small"><strong>Your response (${esc(r.response_status)}):</strong> ${esc(r.response_body)}</p>`:`<button class="btn light" onclick="respond(${r.review_id})">Respond</button>`}</article>`).join(''):'<p class="small">No published reviews yet.</p>'}async function respond(id){const body=prompt('Write your business response. It will be reviewed before appearing publicly.');if(!body)return;const{error}=await db.rpc('submit_review_response',{target_review_id:id,target_body:body});if(error)alert(error.message);else{alert('Response submitted for approval.');loadReviews()}}async function loadStats(){const{data,error}=await db.rpc('get_owner_listing_analytics',{target_listing_id:listing.listing_id,days_back:30});const host=document.getElementById('stats');if(error){host.textContent=error.message;return}const x=data||{};host.innerHTML=`<div><strong>${x.profile_views||0}</strong>Profile Views</div><div><strong>${x.website_clicks||0}</strong>Website Clicks</div><div><strong>${x.phone_clicks||0}</strong>Phone Clicks</div><div><strong>${x.published_reviews||0}</strong>Reviews</div><div><strong>${x.poll_appearances||0}</strong>Polls</div><div><strong>${x.average_rating||'—'}</strong>Rating</div>`}window.addEventListener('DOMContentLoaded',init);</script></body></html>
